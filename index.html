<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>*{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>שאלוני תפיסה עצמית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&family=Assistant:wght@400;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: printed-worksheet look — pastel domain tables with colored answer columns, side "improve" boxes, pastel summary boxes. Deliberately a single light "paper" theme. */
:root{
  color-scheme:light;
  --bg:#EEF2F8; --paper:#FFFFFF; --ink:#1E2A4F; --muted:#5B6584; --line:#DCE2EE; --accent:#2F56B0;
  --social:#24448F; --social-band:#D6E4FA; --social-soft:#F1F6FE;
  --learning:#17775A; --learning-band:#D2EFE1; --learning-soft:#EEF9F3;
  --emotion:#C2295A; --emotion-band:#FBD7E2; --emotion-soft:#FFF1F5;
  --indep:#5B3FB8; --indep-band:#E2D9F6; --indep-soft:#F4F0FC;
  --yes:#3AA850; --yes-col:#E2F5E5; --yes-btn:#4DB861;
  --some:#E3A900; --some-col:#FFF4C7; --some-btn:#FFE07A;
  --help:#DE4850; --help-col:#FDE2E3; --help-btn:#F9B5B8;
  --teal:#13879A; --teal-band:#CBEEF3;
  --staff:#DC6A1E; --staff-band:#FCDCC3; --staff-soft:#FFF3E9;
  --pink:#C42550; --pink-band:#FBDCE5; --pink-soft:#FFF2F6;
  --mint:#1E8A5E; --mint-band:#D7F2E3; --mint-soft:#F0FAF4;
  --idea:#E8B400; --idea-band:#FFF1BF;
  --warn-soft:#FDEBDD; --warn:#B4541A;
  --font-display:"Rubik","Assistant",system-ui,sans-serif;
  --font-body:"Assistant","Rubik","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.45;direction:rtl}
.shell{max-width:1060px;margin:0 auto;padding-inline:16px;padding-block:16px 60px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* app header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:44px;height:44px;border-radius:12px;display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:7px;background:var(--paper);border:1px solid var(--line)}
.brand-mark i{border-radius:4px}
.brand h1{font-size:1.4rem;line-height:1.1}
.brand p{margin:0;color:var(--muted);font-size:.92rem}
.tabs{display:flex;flex-wrap:wrap;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:5px}
.tab{border:0;background:transparent;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}

/* form banner */
.banner{--b:var(--social-band);--bi:var(--social);position:relative;overflow:hidden;text-align:center;background:linear-gradient(180deg,#fff 0%,color-mix(in srgb,var(--b) 70%,#fff) 100%);border:2px solid var(--b);border-radius:24px;padding:22px 150px 18px;display:flex;flex-direction:column;align-items:center;gap:8px}
.banner[data-kind="visual"]{--b:var(--teal-band);--bi:var(--teal)}
.banner[data-kind="staff"]{--b:var(--staff-band);--bi:var(--staff)}
.banner h2{font-size:2rem;line-height:1.2;font-weight:700}
.banner .hl{background:linear-gradient(transparent 52%,color-mix(in srgb,var(--bi) 26%,transparent) 52%);padding:0 8px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.legend{display:inline-block;background:var(--idea-band);border-radius:12px;padding:4px 16px;font-family:var(--font-display);font-weight:700;font-size:1.15rem}
.banner .binst{margin:0;color:var(--muted);font-weight:600;font-size:.95rem}
.deco{position:absolute;pointer-events:none;display:block;line-height:0}
.deco svg{width:100%;height:auto;display:block}
.d-star{width:48px;top:14px;inset-inline-start:22px;transform:rotate(-12deg)}
.d-rays1{width:34px;top:58px;inset-inline-start:78px;transform:scaleX(-1)}
.d-cloud1{width:74px;bottom:10px;inset-inline-start:16px}
.d-squig{width:38px;bottom:20px;inset-inline-start:100px}
.d-mount{width:104px;bottom:4px;inset-inline-end:14px}
.d-pencil{width:58px;top:10px;inset-inline-end:28px}
.d-rays2{width:30px;top:22px;inset-inline-end:96px}
.d-spark{width:18px;top:72px;inset-inline-end:112px}
/* meta */
.meta{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lbl{font-weight:700;font-size:.95rem}
.field input,.field select,.field textarea{border:1.5px solid var(--line);background:#F8FAFD;border-radius:12px;padding:9px 12px;min-height:46px;width:100%}
.field textarea{min-height:80px;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;border:1.5px solid var(--line);background:#F8FAFD;border-radius:12px;padding:8px 10px;font-weight:700;cursor:pointer;min-height:46px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.req{color:var(--help)}

/* domain row = table + improve box */
.drow{--d:var(--social);--band:var(--social-band);--soft:var(--social-soft);display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px;align-items:start}
.drow[data-d="learning"]{--d:var(--learning);--band:var(--learning-band);--soft:var(--learning-soft)}
.drow[data-d="emotion"]{--d:var(--emotion);--band:var(--emotion-band);--soft:var(--emotion-soft)}
.drow[data-d="indep"]{--d:var(--indep);--band:var(--indep-band);--soft:var(--indep-soft)}
.drow.vis,.drow.staffrow{grid-template-columns:minmax(0,1fr)}
.dcard{background:var(--paper);border:2px solid var(--band);border-radius:20px;overflow:hidden;box-shadow:0 2px 0 rgba(30,42,79,.05)}
.grid{--c:76px;display:grid;grid-template-columns:minmax(0,1fr) repeat(3,var(--c))}
.dtitle{display:flex;align-items:center;gap:12px;background:var(--band);padding:10px 16px;min-height:62px}
.dtitle{min-height:76px}
.dtitle .art{margin-inline-start:auto;width:64px;flex:none;line-height:0}
.dtitle .art svg,.vside .art svg{width:100%;height:auto}
.dray{width:24px;flex:none;line-height:0;opacity:.85}
.dray svg{width:100%;height:auto}
.dtitle h3{font-size:1.3rem;color:var(--ink)}
.colh{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.8rem;font-weight:800;padding:6px 2px;text-align:center;line-height:1.1}
.colh .face{width:28px;height:28px}
.colh.yes{background:var(--yes-col)} .colh.some{background:var(--some-col)} .colh.help{background:var(--help-col)}
.qtext{padding:12px 16px;border-top:1px solid var(--line);font-size:1.03rem;display:flex;align-items:center;gap:10px}
.answers{display:contents}
.ans{border:0;border-top:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px;transition:background .15s}
.ans[data-tone="yes"]{--t:var(--yes);background:var(--yes-col)}
.ans[data-tone="some"]{--t:var(--some);background:var(--some-col)}
.ans[data-tone="help"]{--t:var(--help);background:var(--help-col)}
.ans .r{width:24px;height:24px;border-radius:50%;border:2px solid #8C95AE;background:#fff;display:grid;place-items:center;color:#fff;font-size:.8rem;font-weight:900;transition:transform .15s}
.ans .l{display:none;font-size:.78rem;font-weight:800}
.ans:hover .r{border-color:var(--t)}
.ans[aria-pressed="true"]{background:color-mix(in srgb,var(--t) 30%,#fff)}
.ans[aria-pressed="true"] .r{background:var(--t);border-color:var(--t);transform:scale(1.15);animation:pop .25s ease}
.ans[aria-pressed="true"] .r::after{content:"✓"}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.35)}100%{transform:scale(1.15)}}

/* visual version */
.vcard{display:grid;grid-template-columns:118px minmax(0,1fr)}
.vside{background:var(--band);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px 8px;text-align:center}
.vside{position:relative}
.vside .art{width:70px;line-height:0}
.v-rays{width:26px;top:10px;inset-inline-end:10px}
.vside h3{font-size:1.15rem;line-height:1.2}
.vgrid{--c:84px;display:grid;grid-template-columns:64px minmax(0,1fr) repeat(3,var(--c));column-gap:0}
.vgrid .colh{background:transparent;padding-block:6px}
.vgrid .sp{grid-column:span 2}
.pic{border-top:1px solid var(--line);display:grid;place-items:center;padding:8px 0 8px 4px}
.pic span{width:54px;height:54px;border-radius:12px;background:#fff;border:1.5px solid var(--line);display:grid;place-items:center;font-size:2rem;line-height:1}
.vgrid .qtext{font-size:1.12rem;font-weight:700;padding-inline:10px}
.vgrid .ans{background:transparent;padding:6px 5px}
.vb{width:100%;height:58px;border-radius:12px;display:grid;place-items:center;border:2px solid transparent;transition:transform .15s,box-shadow .15s,opacity .15s}
.vb svg{width:36px;height:36px}
.ans[data-tone="yes"] .vb{background:var(--yes-btn);color:#fff}
.ans[data-tone="some"] .vb{background:var(--some-btn)}
.ans[data-tone="help"] .vb{background:var(--help-btn)}
.vgrid .ans[aria-pressed="true"]{background:transparent}
.vgrid .ans[aria-pressed="true"] .vb{border-color:var(--ink);box-shadow:0 0 0 4px color-mix(in srgb,var(--t) 40%,transparent);transform:scale(1.06);animation:pop2 .25s ease}
.vgrid .answers:has(.ans[aria-pressed="true"]) .ans:not([aria-pressed="true"]) .vb{opacity:.4}
@keyframes pop2{0%{transform:scale(1)}50%{transform:scale(1.14)}100%{transform:scale(1.06)}}

/* improve box & checkbox items */
.ibox{background:var(--soft);border:2px solid var(--band);border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.ibox h4,.vimprove h4{display:flex;align-items:center;justify-content:center;gap:8px}
.tg{width:34px;flex:none;line-height:0}.tg svg{width:100%;height:auto}
.ibox h4{font-size:1.05rem;text-align:center;padding-bottom:6px;border-bottom:2px solid var(--band);margin-bottom:4px}
.vimprove{border-top:2px dashed var(--band);background:var(--soft);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.vimprove h4{font-size:1.05rem;justify-content:flex-start}
.chips{display:flex;flex-direction:column;gap:2px}
.chip{--c:var(--d,var(--accent));border:0;background:transparent;display:flex;align-items:center;gap:10px;text-align:right;padding:6px 4px;cursor:pointer;border-radius:10px;min-height:40px;width:100%}
.chip:hover{background:rgba(255,255,255,.7)}
.chip .box{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid #8C95AE;background:#fff;display:grid;place-items:center;color:#fff;font-size:.85rem;font-weight:900}
.chip[aria-pressed="true"] .box{background:var(--c);border-color:var(--c)}
.chip[aria-pressed="true"] .box::after{content:"✓"}
.chip[aria-pressed="true"] .cl{font-weight:700}
.chip .ce{flex:none;width:30px;height:30px;display:grid;place-items:center;font-size:1.45rem;line-height:1}
.chip .ce svg{width:28px;height:28px}
.other-input{border:0;border-bottom:2px solid #B7BFD2;background:transparent;padding:4px 6px;margin-inline-start:32px;width:calc(100% - 32px)}
.chips.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.chips.cards .chip{flex-direction:column;justify-content:center;background:#fff;border:2px solid var(--band);border-radius:16px;min-height:96px;padding:10px 6px;position:relative;text-align:center}
.chips.cards .chip .ce{font-size:2.1rem;width:44px;height:44px}
.chips.cards .chip .box{position:absolute;top:8px;inset-inline-start:8px}
.chips.cards .chip[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--band) 55%,#fff)}


.drow[data-d="climate"]{--d:#13879A;--band:var(--teal-band);--soft:#EDF9FB}
.drow[data-d="climate"] .dcard{border-color:#F6C9A0}
.drow[data-d="climate"] .dtitle{background:linear-gradient(90deg,#FCDCC3 0%,var(--teal-band) 55%)}
.drow[data-d="climate"] .vside{background:linear-gradient(180deg,var(--teal-band) 0%,#FCDCC3 100%)}
.single .chip .box{border-radius:50%}
.ghint{margin:-2px 0 4px;text-align:center;color:var(--muted);font-size:.85rem}
.vimprove .ghint{text-align:start}
.vimprove h4{display:flex;align-items:center;gap:8px}

.goalpanel{border-top:2px dashed color-mix(in srgb,var(--d) 35%,transparent);background:var(--soft);padding:12px 16px 14px;display:flex;flex-direction:column;gap:8px}
.goalpanel h4{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:1.08rem}
.goalpanel h4 .ghint{margin:0;font-weight:400;font-family:var(--font-body)}
.chips.gp{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 10px}
.chips.gp .chip{background:#fff;border:1.5px solid var(--band);border-radius:12px;padding:8px 10px}
.chips.gp .chip[aria-pressed="true"]{border-color:var(--d);background:color-mix(in srgb,var(--band) 60%,#fff)}
.chips.gp .other-input{grid-column:1/-1;margin-inline-start:0;width:100%;max-width:420px}

.msg.note{background:var(--idea-band);color:var(--ink);font-weight:500}
.msg.ok{background:var(--yes-col);color:#1E6B33}
.ed-tabs{align-self:flex-start}
.edlist{display:flex;flex-direction:column;gap:12px}
.edrow{display:flex;flex-direction:column;gap:4px}
.edrow label{font-weight:700;font-size:.92rem;display:flex;gap:8px;align-items:center}
.edrow textarea{border:1.5px solid var(--line);background:#F8FAFD;border-radius:12px;padding:9px 12px;width:100%;resize:vertical;min-height:48px}
.edrow.changed textarea{border-color:var(--accent);background:#fff}
.edmeta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:.82rem}

.pchart{margin:0;background:linear-gradient(180deg,#fff,#F7F9FD);border:1px solid var(--line);border-radius:16px;padding:12px 12px 8px;overflow-x:auto}
.pchart svg{width:100%;min-width:520px;height:auto;display:block}
.pchart .grid line{stroke:var(--line);stroke-dasharray:3 4}
.pchart .grid text{font-size:10px;fill:var(--muted)}
.pchart .val{font-size:10px;font-weight:700;fill:var(--ink)}
.pchart .lab{font-size:12.5px;font-weight:700;fill:var(--ink);font-family:var(--font-display)}
.pchart .staffmark{stroke:#1E2A4F;stroke-width:3;stroke-linecap:round}
.pchart figcaption{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;font-size:.82rem;color:var(--muted);padding-top:6px}
.pchart figcaption span{display:inline-flex;align-items:center;gap:6px}
.pchart .sw{width:14px;height:10px;border-radius:3px;background:var(--accent);display:inline-block}
.pchart .sm{width:16px;height:3px;border-radius:2px;background:#1E2A4F;display:inline-block}

/* print pages (A4 at 96dpi) */
.panel.prctl,.prctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.prctl .seg button{font-size:.9rem}
.pwrap{overflow-x:auto;padding:16px 4px;display:flex;flex-direction:column;align-items:center;gap:22px;background:#DCE2EE;border-radius:20px}
.ppage{width:794px;height:1123px;flex:none;background:#fff;color:#1E2A4F;padding:34px 40px 50px;box-sizing:border-box;position:relative;overflow:hidden;direction:rtl;font-family:var(--font-body);font-size:13px;line-height:1.4;box-shadow:0 6px 20px rgba(30,42,79,.18);display:flex;flex-direction:column;gap:12px}
.ph{display:flex;align-items:center;gap:16px;border-radius:18px;padding:14px 20px;background:linear-gradient(90deg,#D6E4FA,#E2D9F6 55%,#FBD7E2)}
.ph.cover{background:linear-gradient(90deg,#CBEEF3,#D2EFE1 50%,#FFF1BF)}
.ph.staff{background:linear-gradient(90deg,#FCDCC3,#FFF1BF)}
.ph-art{width:44px;flex:none;line-height:0}.ph-art2{width:74px;flex:none;line-height:0;margin-inline-start:auto}
.ph svg{width:100%;height:auto}
.ph-eyebrow{font-size:11px;font-weight:700;letter-spacing:.04em;color:#5B6584}
.ph h1{font-family:var(--font-display);font-size:26px;line-height:1.15;margin:2px 0}
.ph-sub{font-size:13px;font-weight:600}
.ps{font-family:var(--font-display);font-size:16px;margin:4px 0 0}
.pt{width:100%;border-collapse:collapse;font-size:13px}
.pt th{background:#1E2A4F;color:#fff;font-weight:700;padding:6px 8px;text-align:center;font-size:12px}
.pt th small{font-weight:400;opacity:.8}
.pt td{border-bottom:1px solid #DCE2EE;padding:6px 8px;text-align:center;white-space:nowrap}
.pt.small td,.pt.small th{padding:4px 6px;font-size:12px}
.pt td:first-child{text-align:right}
.pd{font-weight:700;border-inline-start:6px solid var(--pc);background:var(--pcs)}
.psc{display:inline-block;min-width:38px;border-radius:7px;padding:1px 6px;font-weight:800}
.psc.s3{background:#C9EFD3;color:#1E6B33}.psc.s2{background:#FFF1BF;color:#7A5A00}.psc.s1{background:#FBD5D7;color:#9B2530}
.pm{color:#5B6584}
.plegend{display:flex;gap:10px;justify-content:center;font-size:12px}
.plegend span{border-radius:7px;padding:2px 10px;font-weight:700}
.pl3{background:#C9EFD3}.pl2{background:#FFF1BF}.pl1{background:#FBD5D7}
.pchartwrap .pchart{padding:6px 8px 4px;border-radius:14px}
.pchartwrap .pchart svg{min-width:0}
.pchartwrap .pchart{width:74%;margin:0 auto}
.pchartwrap figcaption{font-size:11px;padding-top:2px}
.ppage .pt td{padding:4px 8px}
.pbox{border:2px solid var(--pcb);border-radius:14px;padding:8px 12px;background:var(--pcs)}
.pbox h3{margin:0 0 4px;font-size:14px;color:var(--pc)}
.pbox ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.pbox ul.two{display:grid;grid-template-columns:1fr 1fr;column-gap:18px}
.ppage{gap:10px}
.pbox li::before{content:"•";color:var(--pc);font-weight:900;margin-inline-end:6px}
.pbox p{margin:0}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pgrid.three{grid-template-columns:1fr 1fr 1fr}
.pdom{border-radius:12px;border:1.5px solid var(--pcb);overflow:hidden}
.pdom h3{margin:0;padding:5px 12px;font-size:13.5px;background:var(--pch);border-inline-start:6px solid var(--pc)}
.pq{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 12px;border-top:1px solid #EEF1F7;font-size:12.5px}
.pans{flex:none;border-radius:999px;padding:1px 10px;font-weight:800;font-size:11.5px}
.pans.yes{background:#C9EFD3;color:#1E6B33}.pans.some{background:#FFF1BF;color:#7A5A00}.pans.help{background:#FBD5D7;color:#9B2530}.pans.none{background:#EEF1F7;color:#5B6584}
.pgoal{padding:4px 12px 6px;font-size:12px;background:#FFFBEA;border-top:1px dashed #F0D98A}
.ppage.filled{gap:8px}
.pf{position:absolute;bottom:16px;inset-inline:40px;display:flex;justify-content:space-between;font-size:10.5px;color:#5B6584;border-top:1px solid #DCE2EE;padding-top:6px}

.pwov{position:fixed;inset:0;background:rgba(30,42,79,.45);display:grid;place-items:center;z-index:50;padding:16px}
.pwbox{background:#fff;border-radius:20px;padding:22px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 50px rgba(30,42,79,.3)}
.pwbox h3{font-size:1.3rem}.pwbox p{margin:0}
.pwbox input{border:1.5px solid var(--line);background:#F8FAFD;border-radius:12px;padding:10px 12px;min-height:46px}
.pwbox .row{display:flex;gap:8px}

/* Original AAC-style pictograms: thick outline, flat colours, simple figures. viewBox 0 0 100 100 */
const SYM = (()=>{
  const K="#1d1d1f", SW=2.6;
  const st=`stroke="${K}" stroke-width="${SW}" stroke-linejoin="round" stroke-linecap="round"`;
  const SKIN="#F6C9A0", HAIR="#5A3B22";
  /* stick figure: cx = centre x, by = feet y, s = scale (1 ≈ 60px tall) */
  function person(cx, by, s=1, o={}){
    const lw=3.2*s+0.6, hr=10*s, H=60*s, hy=by-H+hr, neck=hy+hr, hip=neck+21*s, sh=neck+5*s;
    const line=(d)=>`<path d="${d}" fill="none" stroke="${K}" stroke-width="${lw}" stroke-linecap="round" stroke-linejoin="round"/>`;
    const arm=(side,kind)=>{ const x0=cx, y0=sh; let p;
      if(kind==="up") p=`M${x0} ${y0} L${x0+side*12*s} ${y0-5*s} L${x0+side*17*s} ${y0-17*s}`;
      else if(kind==="side") p=`M${x0} ${y0} L${x0+side*11*s} ${y0+5*s} L${x0+side*19*s} ${y0+3*s}`;
      else if(kind==="fwd") p=`M${x0} ${y0} L${x0+side*9*s} ${y0+8*s} L${x0+side*18*s} ${y0+7*s}`;
      else if(kind==="hip") p=`M${x0} ${y0} L${x0+side*10*s} ${y0+8*s} L${x0+side*4*s} ${y0+15*s}`;
      else if(kind==="face") p=`M${x0} ${y0} L${x0+side*9*s} ${y0+6*s} L${x0+side*6*s} ${hy+3*s}`;
      else if(kind==="ears") p=`M${x0} ${y0} L${x0+side*12*s} ${y0-1*s} L${x0+side*10*s} ${hy}`;
      else p=`M${x0} ${y0} L${x0+side*6*s} ${y0+10*s} L${x0+side*8*s} ${y0+19*s}`;
      return line(p); };
    let legs;
    if(o.sit) legs=line(`M${cx} ${hip} L${cx+13*s} ${hip+1*s} L${cx+13*s} ${by}`);
    else if(o.cross) legs=line(`M${cx} ${hip} L${cx-14*s} ${hip+6*s} L${cx+6*s} ${hip+8*s} M${cx} ${hip} L${cx+14*s} ${hip+6*s} L${cx-6*s} ${hip+8*s}`);

async function fillNames(){
  // name suggestions only for viewers who can read stored data
  const db = await getDb(); if(!db) return;
  try{
    const snap = await db.collection("responses").limit(1000).get();
    const names = new Set(); const classes = new Set();
    snap.docs.forEach(d=>{const x=d.data(); if(x?.name) names.add(x.name); if(x?.className) classes.add(x.className);});
    FILLS = snap.docs.map(d=>d.data()).filter(isV2); refreshStudentField();
    const dl = $("#names"); if(dl) dl.innerHTML = [...names].sort().map(n=>`<option value="${esc(n)}">`).join("");
    const sel = $("#f-class");
    if(sel){ [...classes].filter(c=>!CLASSES.includes(c) && !rosterClasses().includes(c)).sort().forEach(c=>{ const o=document.createElement("option"); o.textContent=c; sel.insertBefore(o, sel.querySelector('[value="__other"]')); }); }
  }catch(e){}
}

function updateProgress(){
  const total = state.type==="staff"? 14 : 16;
  const n = Object.keys(state.answers).length;
  const p = $("#progress"); if(p) p.textContent = `${n} מתוך ${total} שאלות נענו`;
}

document.addEventListener("click", e=>{
  const t = e.target.closest("button"); if(!t) return;
  if(t.dataset.tab){ switchTab(t.dataset.tab); return; }
  if(!state || !t.closest("#qform")) return;
  if(t.dataset.item){
    const id=t.dataset.item, v=+t.dataset.v;
    state.answers[id] = v;
    t.parentElement.querySelectorAll(".ans").forEach(b=>b.setAttribute("aria-pressed", b===t?"true":"false"));
    updateProgress(); return;
  }
  if(t.dataset.tp){
    state.tp = t.dataset.tp;
    t.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", b===t?"true":"false")); return;
  }
  if(t.dataset.group){
    const g=t.dataset.group, v=t.dataset.value, on=t.getAttribute("aria-pressed")==="true";
    /* one goal per domain: radio-like, tap again to clear */
    if(g.startsWith("goal:")){
      const k=g.split(":")[1], box=t.closest(".chips");
      box.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed", (!on && b===t)?"true":"false"));
      const inp = box.querySelector(`[data-other="${g}"]`);
      if(on){ state.goals[k]=""; delete state.other[g]; if(inp){ inp.hidden=true; inp.value=""; } return; }
      if(v==="__other"){ state.goals[k]="__other"; state.other[g]=state.other[g]||""; if(inp){ inp.hidden=false; inp.focus(); } }
      else { state.goals[k]=v; delete state.other[g]; if(inp){ inp.hidden=true; inp.value=""; } }
      return;
    }
    if(v==="__other"){
      const inp = document.querySelector(`[data-other="${g}"]`);
      if(on){ delete state.other[g]; inp.hidden=true; inp.value=""; t.setAttribute("aria-pressed","false"); }
      else {
        if(g==="sHelps" && state.sHelps.size + 1 > 2){ flashHint(); return; }
        state.other[g]=""; inp.hidden=false; inp.focus(); t.setAttribute("aria-pressed","true");
      }
      return;
    }
    if(g==="sStrength"||g==="sNeed"){
      state[g] = on? "" : v;
      t.parentElement.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed", (!on && b===t)?"true":"false")); return;
    }
    const set = state[g];
    if(on){ set.delete(v); t.setAttribute("aria-pressed","false"); }
    else {
      if(g==="sHelps" && set.size + (state.other.sHelps!=null?1:0) >= 2){ flashHint(); return; }
      set.add(v); t.setAttribute("aria-pressed","true");
    }
  }
});
function flashHint(){ const h=$("#shelps-hint"); if(h){ h.textContent="אפשר לבחור עד 2 – בטל/י בחירה אחת כדי לבחור אחרת."; h.style.color="var(--warn)"; } }

document.addEventListener("input", e=>{
  const t=e.target; if(!state) return;
  if(t.dataset.other){ state.other[t.dataset.other]=t.value; }
  if(t.id==="f-name") state.name=t.value;
  if(t.id==="f-class-other") state.clsOther=t.value;
  if(t.id==="f-date") state.date=t.value;
  if(t.id==="f-note") state.note=t.value;
});
document.addEventListener("change", e=>{
  if(e.target.id==="f-class"){ state.cls=e.target.value; const o=$("#f-class-other"); o.hidden = state.cls!=="__other"; if(!o.hidden) o.focus(); }

document.addEventListener("submit", async e=>{
  if(e.target.id!=="qform") return;
  e.preventDefault();
  const msg=$("#formmsg"); msg.innerHTML="";
  const className = state.cls==="__other"? nameKey(state.clsOther) : state.cls;
  const missing=[];
  if(!nameKey(state.name)) missing.push("שם התלמיד/ה");
  if(!className) missing.push("כיתה");
  if(!state.tp) missing.push("מועד הערכה");
  if(missing.length){ msg.innerHTML=`<div class="msg err">חסר: ${missing.join(", ")}. ממלאים בראש הדף ושומרים שוב.</div>`; $(".meta").scrollIntoView({behavior:"smooth",block:"center"}); return; }
  const doc = buildDoc(className);
  const btn=$("#submitbtn"); btn.disabled=true; btn.textContent="שומר…";
  const db = await getDb();
  if(!db){ btn.disabled=false; btn.textContent="שמירת השאלון"; msg.innerHTML=`<div class="msg err">אין חיבור למאגר הנתונים. בודקים את החיבור לאינטרנט ומנסים שוב.</div>`; return; }
  try{
    await db.collection("responses").add(doc);
    $("#view").innerHTML = `<section class="done"><div class="big" aria-hidden="true">🌟</div><h2>תודה! השאלון נשמר</h2><p class="muted">${esc(doc.name)} · ${esc(doc.className)} · ${TP[doc.timepoint]}</p><button class="btn" type="button" id="again">מילוי חדש</button></section>`;
    $("#again").onclick=()=>renderForm(currentTab);
    window.scrollTo({top:0,behavior:"smooth"});
  }catch(err){
    btn.disabled=false; btn.textContent="שמירת השאלון";
    const c = err && err.code;
    msg.innerHTML = `<div class="msg err">${c==="invalid_argument"? "השמירה נדחתה. בודקים שהשם והכיתה מולאו ומנסים שוב." : c==="quota_exceeded"? "מאגר הנתונים מלא. מוחקים מילויים ישנים בלשונית הנתונים ומנסים שוב." : "השמירה נכשלה לרגע. לוחצים שוב על שמירה."}</div>`;
  }
});

function buildDoc(className){
  const s=state;
  const withOther = (arr,g)=> { const o = s.other[g]; return o!=null ? [...arr, o.trim()? "אחר: "+o.trim() : "אחר"] : [...arr]; };
  const doc = {version:VERSION, type:s.type, name:nameKey(s.name), nameKey:nameKey(s.name).toLowerCase(), className, timepoint:s.tp, date:s.date||today(),
    createdAt:new Date().toISOString(), texts_version:textsVersion, answers:{...s.answers}};
  DOMAINS.forEach(d=>{ doc[d.field] = avg([1,2,3].map(i=>s.answers[d.k+i])); });
  if(s.type!=="staff"){
    doc.school_climate_score = avg([1,2,3,4].map(i=>s.answers["climate"+i]));
    DOMAINS.forEach(d=>{ const v=s.goals[d.k], g="goal:"+d.k; doc[GOAL_FIELD[d.k]] = v==="__other"? ((s.other[g]||"").trim()? "אחר: "+s.other[g].trim() : "אחר") : v; });
    doc.perceived_strengths = withOther([...s.strengths],"strengths");
    doc.supports_that_help = withOther([...s.helps],"helps");
    doc.interests_and_empowerment = withOther([...s.interests],"interests");
  } else {
    doc.teacher_strength = s.sStrength;
    doc.teacher_need = s.sNeed;
    doc.teacher_supports = withOther([...s.sHelps],"sHelps");
    doc.teacher_note = s.note.trim();
    STAFF_OBS.forEach(o=>{ doc[o.k] = s.answers[o.id] ?? null; });
  }
  return doc;
}

const QNAME = {high:"תלמיד/ה – מילולי", visual:"שאלון בתת״ח", staff:"צוות"};
function textEntries(){
  const E=[];
  for(const q of ["high","visual","staff"]){
    DOMAINS.forEach(d=>{
      E.push({key:`title.${q}.${d.k}`, q, sec:d.name, label:"כותרת התחום", obj:d.t, prop:q});
      ITEMS[q][d.k].forEach((_,i)=>E.push({key:`item.${q}.${d.k}.${i}`, q, sec:d.name, label:`היגד ${i+1}`, obj:ITEMS[q][d.k], prop:i}));
    });
    if(q!=="staff"){
      E.push({key:`title.${q}.climate`, q, sec:"אקלים בית־ספרי", label:"כותרת", obj:CLIMATE.title, prop:q});
      CLIMATE[q].forEach((_,i)=>E.push({key:`climate.${q}.${i}`, q, sec:"אקלים בית־ספרי", label:`שאלה ${i+1}`, obj:CLIMATE[q], prop:i}));
    } else {
      STAFF_OBS.forEach((o,i)=>E.push({key:`obs.${i}`, q, sec:"שאלות תצפית", label:`שאלה ${i+1}`, obj:o, prop:"t"}));
    }
  }
  return E;
}
const TEXT_DEFAULTS = Object.fromEntries(textEntries().map(e=>[e.key, e.obj[e.prop]]));
let textOverrides = {}, textsVersion = "2026-10-10";
function applyTexts(ov){
  textOverrides = ov||{};
  textEntries().forEach(e=>{ e.obj[e.prop] = (typeof textOverrides[e.key]==="string" && textOverrides[e.key].trim())? textOverrides[e.key] : TEXT_DEFAULTS[e.key]; });
}
async function loadTexts(){
  const db = await getDb(); if(!db) return;
  try{
    const snap = await db.doc("config/texts").get();
    if(!snap.exists) return;
    const d = snap.data()||{};
    configCache = d; ROSTER = (d.roster && typeof d.roster==="object")? d.roster : {};
    applyTexts(d.overrides); textsVersion = (d.updatedAt && d.updatedAt!=="default")? d.updatedAt : "2026-10-10";
    const untouched = state && !Object.keys(state.answers).length && !state.name;
    if(untouched && currentTab!=="data") renderForm(currentTab);
  }catch(e){}
}

async function makePdf(){
  const m=$("#prmsg"), btn=$("#pr-pdf"); m.innerHTML="";
  if(!window.html2canvas || !window.jspdf){ m.innerHTML=`<div class="msg err">רכיב ה־PDF לא נטען. מרעננים את הדף ומנסים שוב.</div>`; return; }
  const dl = downloadsAdapter;
  if(!dl){ m.innerHTML=`<div class="msg err">הורדת קבצים לא זמינה בתצוגה הזו. מנסים שוב.</div>`; return; }
  const pages=[...document.querySelectorAll("#pwrap .ppage")];
  btn.disabled=true;
  try{
    if(document.fonts?.ready) await document.fonts.ready;
    const pdf = new jspdf.jsPDF({orientation:"portrait", unit:"mm", format:"a4", compress:true});
    for(let i=0;i<pages.length;i++){
      btn.textContent=`מכין עמוד ${i+1} מתוך ${pages.length}…`;
      const c = await html2canvas(pages[i], {scale:2, backgroundColor:"#ffffff", useCORS:true, logging:false, windowWidth:900});
      if(i) pdf.addPage();
      pdf.addImage(c.toDataURL("image/jpeg",0.92), "JPEG", 0, 0, 210, 297);
    }
    const data = new Uint8Array(pdf.output("arraybuffer"));
    const tpName = pr.tp==="all"?"כל-השנה":TP[pr.tp].replace(/ /g,"-");
    await dl.save({filename:`${pr.kind==="summary"?"דפי-סיכום":"שאלונים-ממולאים"}-${pr.cls.replace(/ /g,"-")}-${tpName}.pdf`, data});
    m.innerHTML=`<div class="msg ok">✅ הקובץ מוכן. פותחים אותו ומדפיסים.</div>`;
  }catch(e){ console.log("pdf err",e&&(e.message||e.code||e)); if(e?.code!=="cancelled" && e?.code!=="declined") m.innerHTML=`<div class="msg err">יצירת הקובץ לא הושלמה. לוחצים שוב.</div>`; }
  finally{ btn.disabled=false; btn.textContent="⬇️ הורדת PDF להדפסה"; }
}

/* ---------- analysis model ---------- */
const isStudentType = t => t==="high"||t==="visual";
const isV2 = r => r.version===VERSION;
const GAP_FLAG = 0.7;
function buildModel(rows){
  const students = new Map();
  const sorted = rows.filter(isV2).sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt)));
  for(const r of sorted){
    const key = (r.className||"")+"|"+(r.nameKey||nameKey(r.name).toLowerCase());
    if(!students.has(key)) students.set(key,{key,name:r.name,className:r.className,self:{},staff:{}});
    const s = students.get(key); s.name=r.name;
    if(!TP[r.timepoint]) continue;
    if(isStudentType(r.type)) s.self[r.timepoint]=r; else if(r.type==="staff") s.staff[r.timepoint]=r;
  }
  for(const s of students.values()) s.insights = insightsFor(s);
  return [...students.values()].sort((a,b)=>a.className.localeCompare(b.className,"he")||a.name.localeCompare(b.name,"he"));
}
function gapsAt(s,tp){
  const a=s.self[tp], b=s.staff[tp]; if(!a||!b) return null;
  return Object.fromEntries(DOMAINS.map(d=>{ const x=dscore(a,d.k), y=dscore(b,d.k); return [d.k, (x!=null&&y!=null)? Math.round((x-y)*100)/100 : null]; }));
}
function biggestGap(g){
  if(!g) return null;
  const arr = Object.entries(g).filter(x=>x[1]!=null); if(!arr.length) return null;
  return arr.reduce((x,y)=>Math.abs(y[1])>Math.abs(x[1])?y:x);
}
const meanAbsGap = g => g? avg(Object.values(g).filter(x=>x!=null).map(Math.abs)) : null;
const firstLast = (obj) => { const t=TP_ORDER.filter(x=>obj[x]); return t.length? [t[0], t.at(-1)] : null; };
function change(s, getter){
  const fl = firstLast(s.self); if(!fl || fl[0]===fl[1]) return null;
  const a=getter(s.self[fl[0]]), b=getter(s.self[fl[1]]);
  return (a!=null&&b!=null)? Math.round((b-a)*100)/100 : null;
}
function insightsFor(s){
  const out=[];
  const fl = firstLast(s.self);
  if(fl){
    const last = s.self[fl[1]], sc = DOMAINS.map(d=>[d.k,dscore(last,d.k)]).filter(x=>x[1]!=null);
    if(sc.length){
      const hi = sc.reduce((a,b)=>b[1]>a[1]?b:a), lo = sc.reduce((a,b)=>b[1]<a[1]?b:a);
      if(hi[1]===lo[1]) out.push(`בהערכה האחרונה (${TP[last.timepoint]}) התלמיד/ה מעריך/ה את עצמו/ה באופן דומה בכל התחומים (${f2(hi[1])}).`);
      else {
        out.push(`התחום שבו התלמיד/ה מעריך/ה את עצמו/ה הכי גבוה: ${DNAME[hi[0]]} (${f2(hi[1])}).`);
        out.push(`התלמיד/ה מעריך/ה את עצמו/ה נמוך יחסית בתחום ${DNAME[lo[0]]} (${f2(lo[1])}).`);
        if(lo[1]<=1.67) out.push(`התחום ${DNAME[lo[0]]} עולה כתחום שכדאי לבדוק לעומק.`);
      }
    }
    if(fl[0]!==fl[1]){
      const a=s.self[fl[0]], b=s.self[fl[1]];
      const diffs = DOMAINS.map(d=>[d.k, (dscore(a,d.k)!=null&&dscore(b,d.k)!=null)? dscore(b,d.k)-dscore(a,d.k) : null]).filter(x=>x[1]!=null);
      if(diffs.length){
        const up = diffs.reduce((x,y)=>y[1]>x[1]?y:x), down = diffs.reduce((x,y)=>y[1]<x[1]?y:x);
        if(up[1]>0.01) out.push(`ניכר שיפור בתפיסת המסוגלות בתחום ${DNAME[up[0]]} (${f2(dscore(a,up[0]))} → ${f2(dscore(b,up[0]))}).`);
        if(down[1]<-0.3) out.push(`בתחום ${DNAME[down[0]]} ההערכה העצמית ירדה (${f2(dscore(a,down[0]))} → ${f2(dscore(b,down[0]))}). תחום שכדאי לבדוק לעומק.`);
      }
    }
    const cl = s.self[fl[1]].school_climate_score;
    if(cl!=null){
      const ch = change(s, r=>r.school_climate_score);
      out.push(`ציון אקלים בית־ספרי: ${f2(cl)}${ch!=null&&Math.abs(ch)>=0.01? ` (שינוי מתחילת המעקב: ${sgn(ch)})` : ""}.`);
    }
  }
  const both = TP_ORDER.filter(t=>s.self[t]&&s.staff[t]);
  if(both.length){
    const big = biggestGap(gapsAt(s,both.at(-1)));
    if(big){
      if(Math.abs(big[1])>=GAP_FLAG) out.push(`קיים פער בין תפיסת התלמיד/ה לבין התרשמות הצוות בתחום ${DNAME[big[0]]}: התלמיד/ה מעריך/ה את עצמו/ה ${big[1]<0?"נמוך":"גבוה"} יותר מהתרשמות הצוות (${sgn(big[1])}).`);
      else out.push(`קיימת התאמה גבוהה בין תפיסת התלמיד/ה לבין התרשמות הצוות בכל התחומים.`);
    }
  }
  if(both.length>=2){
    const g0=meanAbsGap(gapsAt(s,both[0])), g1=meanAbsGap(gapsAt(s,both.at(-1)));
    if(g0!=null&&g1!=null){
      if(g0-g1>=0.3) out.push(`ניכר צמצום בפער בין תפיסת התלמיד/ה לבין התרשמות הצוות (פער ממוצע ${f2(g0)} → ${f2(g1)}).`);
      else if(g1-g0>=0.3) out.push(`הפער בין תפיסת התלמיד/ה לבין התרשמות הצוות גדל (${f2(g0)} → ${f2(g1)}). נושא שכדאי לבדוק לעומק.`);
    }
  }
  return out;
}
function latestSelf(s){ const t=TP_ORDER.filter(x=>s.self[x]).at(-1); return t? s.self[t]:null; }
function latestStaff(s){ const t=TP_ORDER.filter(x=>s.staff[x]).at(-1); return t? s.staff[t]:null; }
const goalsOf = r => DOMAINS.map(d=>[d.k, r?.[GOAL_FIELD[d.k]]||""]);
const goalsText = r => goalsOf(r).filter(x=>x[1]).map(x=>`${DNAME[x[0]]}: ${x[1]}`);
function domainAverages(students){
  const res={};
  for(const tp of TP_ORDER){ res[tp]={self:{},staff:{}};
    for(const d of DOMAINS){
      res[tp].self[d.k]=avg(students.map(s=>dscore(s.self[tp],d.k)));
      res[tp].staff[d.k]=avg(students.map(s=>dscore(s.staff[tp],d.k)));
    }
    res[tp].climate = avg(students.map(s=>s.self[tp]?.school_climate_score));
  }
  return res;
}
const normOther = i => i.startsWith("אחר")? "אחר" : i;
function interestCounts(students){
  const c=new Map();
  students.forEach(s=>{ (latestSelf(s)?.interests_and_empowerment||[]).forEach(i=>{ const k=normOther(i); c.set(k,(c.get(k)||0)+1); }); });
  return [...c.entries()].sort((a,b)=>b[1]-a[1]);
}

function makeSheet(aoa, {headerRows=[], titleRows=[], widths=[], gapCols=[], domainCols={}, freeze=true}={}){
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const range = XLSX.utils.decode_range(ws["!ref"]||"A1:A1");
  for(let r=range.s.r;r<=range.e.r;r++) for(let c=range.s.c;c<=range.e.c;c++){
    const ref=XLSX.utils.encode_cell({r,c}); const cell=ws[ref]; if(!cell) continue;
    if(titleRows.includes(r)) cell.s=XT;
    else if(headerRows.includes(r)) cell.s = domainCols[c]? {...XH, fill:{fgColor:{rgb:domainCols[c]}}, font:{...XH.font,color:{rgb:"1F2A44"}}} : XH;
    else {
      let s={...XC};
      if(typeof cell.v==="number"){ s={...XC, alignment:{...XC.alignment,horizontal:"center"}}; cell.z="0.00"; }
      if(gapCols.includes(c) && typeof cell.v==="number" && Math.abs(cell.v)>=GAP_FLAG) s={...s, fill:{fgColor:{rgb:"FDEBDD"}}, font:{name:"Arial",bold:true,color:{rgb:"B4541A"}}};

async function exportExcel(){
  const m=$("#xmsg"); m.innerHTML="";
  if(!window.ExcelJS){ m.innerHTML=`<div class="msg err">רכיב ה־Excel לא נטען. מרעננים את הדף ומנסים שוב.</div>`; return; }
  const rows = classFilter==="__all"? allRows : allRows.filter(r=>r.className===classFilter);
  if(!rows.length){ m.innerHTML=`<div class="msg err">אין עדיין נתונים לייצוא.</div>`; return; }
  const btn=$("#xlsx"); btn.disabled=true; btn.textContent="מכין את הקובץ…";
  try{
    const wb = buildSmartWorkbook(ExcelJS, rows, classFilter==="__all"? "כל הכיתות" : classFilter);
    const buf = await wb.xlsx.writeBuffer();
    const dl = downloadsAdapter;
    if(!dl){ m.innerHTML=`<div class="msg err">הורדת קבצים לא זמינה בתצוגה הזו. מנסים שוב.</div>`; return; }
    try{ await dl.save({filename:`מיפוי-עצמי-${classFilter==="__all"?"כל-הכיתות":classFilter}-${today()}.xlsx`, data:new Uint8Array(buf)}); }
    catch(e){ if(e?.code!=="cancelled" && e?.code!=="declined") m.innerHTML=`<div class="msg err">השמירה לא הושלמה. לוחצים שוב על ייצוא.</div>`; }
  } finally { btn.disabled=false; btn.textContent="ייצוא ל־Excel חכם"; }
}
/* ---------- smart Excel (ExcelJS, formula-driven) ---------- */
function buildSmartWorkbook(ExcelJS, allRowsIn, scopeLabel){
  const wb = new ExcelJS.Workbook();
  wb.creator = "מיפוי עצמי"; wb.created = new Date(); wb.calcProperties = {fullCalcOnLoad:true};
  const FONT = "Arial";
  const C = {navy:"FF1E2A4F", ink:"FF1E2A4F", muted:"FF5B6584", white:"FFFFFFFF", line:"FFDCE2EE", paper:"FFF7F9FD",
    social:["FFD6E4FA","FF24448F"], learning:["FFD2EFE1","FF17775A"], emotion:["FFFBD7E2","FFC2295A"], indep:["FFE2D9F6","FF5B3FB8"],
    climate:["FFCBEEF3","FF13879A"], orange:["FFFCDCC3","FFDC6A1E"], yellow:["FFFFF1BF","FFB88700"], pink:["FFFBDCE5","FFC42550"], mint:["FFD7F2E3","FF1E8A5E"],
    good:"FFB9E8C5", mid:"FFFFF1BF", low:"FFF8C4C6", warn:"FFFDEBDD", warnText:"FFB4541A"};
  const DCOLOR = {social:C.social, learning:C.learning, emotion:C.emotion, indep:C.indep, climate:C.climate};
  const fill = argb => ({type:"pattern", pattern:"solid", fgColor:{argb}});
  const thin = {style:"thin", color:{argb:C.line}};
  const box = {top:thin,left:thin,bottom:thin,right:thin};
  const MAXR = 1000;
  const TPN = TP_ORDER.map(t=>TP[t]);

  const v2 = allRowsIn.filter(isV2).sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt)));
  const old = allRowsIn.filter(r=>!isV2(r));

  /* ---- sheet helpers ---- */
  function sheet(name, tab, widths){
    const ws = wb.addWorksheet(name, {views:[{rightToLeft:true, showGridLines:false}], properties:{tabColor:{argb:tab}}});
    ws.pageSetup = {orientation:"landscape", fitToPage:true, fitToWidth:1, fitToHeight:0, paperSize:9, margins:{left:0.4,right:0.4,top:0.5,bottom:0.5,header:0.2,footer:0.2}};
    (widths||[]).forEach((w,i)=>ws.getColumn(i+1).width=w);
    return ws;
  }
  function banner(ws, cols, title, sub, color){
    const last = ws.getColumn(cols).letter;
    ws.mergeCells(`A1:${last}2`);
    const c = ws.getCell("A1"); c.value = title;
    c.font = {name:FONT, size:22, bold:true, color:{argb:C.white}};
    c.fill = fill(color||C.navy); c.alignment = {horizontal:"center", vertical:"middle", readingOrder:"rtl"};
    ws.getRow(1).height = 26; ws.getRow(2).height = 26;
    ws.mergeCells(`A3:${last}3`);
    const s = ws.getCell("A3"); s.value = sub;
    s.font = {name:FONT, size:10, italic:true, color:{argb:C.muted}}; s.alignment = {horizontal:"center", readingOrder:"rtl", wrapText:true};
    ws.getRow(3).height = 20;
  }
  function headerRow(ws, r, labels, colors){
    labels.forEach((l,i)=>{ const c=ws.getCell(r,i+1); c.value=l;
      const col = colors?.[i];
      c.font = {name:FONT, bold:true, size:10, color:{argb: col? C.ink : C.white}};
      c.fill = fill(col || C.navy);
      c.alignment = {horizontal:"center", vertical:"middle", wrapText:true, readingOrder:"rtl"}; c.border = box; });
    ws.getRow(r).height = 32;
  }
  function section(ws, r, cols, title, color){
    const last = ws.getColumn(cols).letter;
    ws.mergeCells(`A${r}:${last}${r}`);
    const c = ws.getCell(`A${r}`); c.value = title;
    c.font = {name:FONT, size:13, bold:true, color:{argb:color?.[1]||C.ink}};
    c.fill = fill(color?.[0]||C.paper); c.alignment = {horizontal:"right", vertical:"middle", readingOrder:"rtl", indent:1};
    ws.getRow(r).height = 24;
  }
  function cell(ws, r, c, v, opt={}){
    const x = ws.getCell(r,c);
    x.value = (typeof v==="string" && v.startsWith("="))? {formula:v.slice(1)} : v;
    x.font = {name:FONT, size:opt.size||10, bold:!!opt.bold, color:{argb:opt.color||C.ink}};
    x.alignment = {horizontal:opt.h||"right", vertical:"middle", wrapText:opt.wrap!==false, readingOrder:"rtl"};
    if(opt.fill) x.fill = fill(opt.fill);
    if(opt.num) x.numFmt = opt.num;
    if(opt.border!==false) x.border = box;
    return x;
  }
  const scaleCF = (ws, ref) => ws.addConditionalFormatting({ref, rules:[{type:"colorScale", priority:1, cfvo:[{type:"num",value:1},{type:"num",value:2},{type:"num",value:3}], color:[{argb:C.low},{argb:C.mid},{argb:C.good}]}]});
  const arrowsCF = (ws, ref) => ws.addConditionalFormatting({ref, rules:[{type:"iconSet", priority:1, iconSet:"3Arrows", cfvo:[{type:"num",value:-100},{type:"num",value:-0.009},{type:"num",value:0.01}]}]});
  const gapCF = (ws, ref, tl) => ws.addConditionalFormatting({ref, rules:[{type:"expression", priority:1, formulae:[`AND(ISNUMBER(${tl}),ABS(${tl})>=${GAP_FLAG})`], style:{fill:{type:"pattern",pattern:"solid",bgColor:{argb:C.warn}}, font:{bold:true,color:{argb:C.warnText}}}}]});
  const barCF = (ws, ref, color, max) => ws.addConditionalFormatting({ref, rules:[{type:"dataBar", priority:1, minLength:0, maxLength:100, gradient:false, cfvo:[{type:"num",value:0}, max==null?{type:"max"}:{type:"num",value:max}], color:{argb:color}}]});

  /* ---- 1. data sheet (built first so we know the columns) ---- */
  const COLS = [];
  const add = (key, label, w, color) => { COLS.push({key,label,w,color}); return COLS.length; };
  add("version","גרסה",10); add("date","תאריך",11); add("tp","מועד",11); add("qtype","סוג שאלון",18); add("name","שם התלמיד/ה",18); add("class","כיתה",14);
  ITEM_IDS.forEach(id=>add("i_"+id, `${DNAME[id.slice(0,-1)]} ${id.slice(-1)}`, 9, DCOLOR[id.slice(0,-1)][0]));
  DOMAINS.forEach(d=>add("s_"+d.k, d.field, 12, DCOLOR[d.k][0]));
  CLIM_IDS.forEach((id,i)=>add("i_"+id, `אקלים ${i+1}`, 9, C.climate[0]));
  add("s_climate","school_climate_score",13,C.climate[0]);
  DOMAINS.forEach(d=>add("g_"+d.k, GOAL_FIELD[d.k], 24, C.yellow[0]));
  add("strengths","perceived_strengths",22); add("supports","supports_that_help",26); add("interests","interests_and_empowerment",28);
  add("t_strength","teacher_strength",14,C.orange[0]); add("t_need","teacher_need",14,C.orange[0]); add("t_supports","teacher_supports",26,C.orange[0]); add("t_note","teacher_note",30,C.orange[0]);
  add("obs_entry","teacher_observation_entry",12,C.orange[0]); add("obs_contact","teacher_observation_contact",12,C.orange[0]);
  add("texts","גרסת נוסחים",14);
  add("key","מפתח תלמיד (עזר)",24,"FFE9ECF4"); add("grp","קבוצה (עזר)",10,"FFE9ECF4"); add("tpo","סדר מועד (עזר)",9,"FFE9ECF4"); add("rown","שורה (עזר)",8,"FFE9ECF4"); add("latest","מילוי אחרון (עזר)",10,"FFE9ECF4"); add("lkey","מפתח אחרון (עזר)",30,"FFE9ECF4");
  const ci = k => COLS.findIndex(c=>c.key===k)+1;
  const colLetter = n => { let s=""; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; };
  const L = k => colLetter(ci(k));
  const DS = "'נתונים'";
  const R = k => `${DS}!$${L(k)}$2:$${L(k)}$${MAXR}`;

  /* lookup formulas reused by other sheets */
  const avgIfs = (scoreKey, crit) => `IFERROR(AVERAGEIFS(${R(scoreKey)},${crit}),"")`;
  const latestVal = (k, keyRef, grp) => `IFERROR(INDEX(${R(k)},MATCH(${keyRef}&"|${grp}|1",${R("lkey")},0)),"")`;
  const txt = v => `IF(${v}="","—",${v})`;

  /* ---- create sheets in display order ---- */
  const wsDash = sheet("דשבורד", C.navy, [22,13,13,13,13,13,13,16,4,22,12]);
  const wsProf = sheet("פרופיל תלמיד", C.pink[1], [22,11,11,10,11,11,10,11,11,10,15]);
  const wsTrack = sheet("מעקב שנתי", C.learning[1], [20,14,22,12,12,12,13]);
  const wsGap = sheet("תלמיד–צוות", C.social[1], [20,14,11,...DOMAINS.flatMap(()=>[9,9,9]),22,12,46]);
  const wsClim = sheet("אקלים בית־ספרי", C.climate[1], [20,14,12,12,12,13,18,18]);
  const wsGoals = sheet("מטרות אישיות", C.yellow[1], [20,14,28,28,28,28]);
  const wsInt = sheet("תחומי עניין והעצמה", C.mint[1], [26,13,4,26,13]);
  const classes = [...new Set(v2.map(r=>r.className).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"he"));
  const wsClasses = classes.map(cl=>({cl, ws: sheet(String(cl).replace(/[\[\]\*\?\/\\:]/g,"").slice(0,31), C.indep[1], [22,12,12,12,12,12,12,14])}));
  const wsData = sheet("נתונים", C.muted, COLS.map(c=>c.w));
  const wsStu = sheet("תלמידים", C.muted, [28,18,14,12,12]);
  const wsLegend = sheet("מקרא והסבר", C.orange[1], [26,48,40,48]);

  /* ---- data rows ---- */
  headerRow(wsData, 1, COLS.map(c=>c.label), COLS.map(c=>c.color));
  wsData.views = [{rightToLeft:true, state:"frozen", xSplit:6, ySplit:1, showGridLines:false}];
  v2.forEach((r,ix)=>{
    const n = ix+2;
    const val = {version:r.version, date:r.date, tp:TP[r.timepoint]||"", qtype:TYPE_LABEL[r.type]||r.type, name:r.name, class:r.className,
      strengths:(r.perceived_strengths||[]).join(", "), supports:(r.supports_that_help||[]).join(", "), interests:(r.interests_and_empowerment||[]).join(", "),
      t_strength:r.teacher_strength||"", t_need:r.teacher_need||"", t_supports:(r.teacher_supports||[]).join(", "), t_note:r.teacher_note||"",
      obs_entry:r.teacher_observation_entry??null, obs_contact:r.teacher_observation_contact??null, texts:r.texts_version||""};
    [...ITEM_IDS,...CLIM_IDS].forEach(id=>val["i_"+id]=r.answers?.[id]??null);
    DOMAINS.forEach(d=>val["g_"+d.k]=r[GOAL_FIELD[d.k]]||"");
    COLS.forEach((c,i)=>{ if(c.key in val){ const x=wsData.getCell(n,i+1); x.value = val[c.key]===""? null : val[c.key]; } });
    DOMAINS.forEach(d=>{ const a=L("i_"+d.k+"1"), b=L("i_"+d.k+"3"); wsData.getCell(n,ci("s_"+d.k)).value={formula:`IF(COUNT(${a}${n}:${b}${n})=0,"",ROUND(AVERAGE(${a}${n}:${b}${n}),2))`}; });
    { const a=L("i_climate1"), b=L("i_climate4"); wsData.getCell(n,ci("s_climate")).value={formula:`IF(COUNT(${a}${n}:${b}${n})=0,"",ROUND(AVERAGE(${a}${n}:${b}${n}),2))`}; }
    wsData.getCell(n,ci("key")).value = {formula:`${L("class")}${n}&" | "&${L("name")}${n}`};
    wsData.getCell(n,ci("grp")).value = {formula:`IF(${L("qtype")}${n}="${TYPE_LABEL.staff}","צוות","תלמיד")`};
    wsData.getCell(n,ci("tpo")).value = {formula:`IF(${L("tp")}${n}="${TPN[0]}",1,IF(${L("tp")}${n}="${TPN[1]}",2,IF(${L("tp")}${n}="${TPN[2]}",3,0)))`};
    wsData.getCell(n,ci("rown")).value = {formula:`ROW()`};
    wsData.getCell(n,ci("latest")).value = {formula:`IF(COUNTIFS(${R("key")},${L("key")}${n},${R("grp")},${L("grp")}${n},${R("tpo")},">"&${L("tpo")}${n})+COUNTIFS(${R("key")},${L("key")}${n},${R("grp")},${L("grp")}${n},${R("tpo")},${L("tpo")}${n},${R("rown")},">"&${L("rown")}${n})=0,1,0)`};
    wsData.getCell(n,ci("lkey")).value = {formula:`${L("key")}${n}&"|"&${L("grp")}${n}&"|"&${L("latest")}${n}`};
    COLS.forEach((c,i)=>{ const x=wsData.getCell(n,i+1); x.font={name:FONT,size:10,color:{argb:c.key==="key"||c.color==="FFE9ECF4"?C.muted:C.ink}}; x.alignment={horizontal:"right",vertical:"top",wrapText:true,readingOrder:"rtl"}; x.border=box; if(c.key.startsWith("s_")) x.numFmt="0.00"; });
  });
  const lastData = Math.max(2, v2.length+1);
  wsData.autoFilter = {from:{row:1,column:1}, to:{row:1,column:COLS.length}};
  if(v2.length){
    wsData.addConditionalFormatting({ref:`A2:${L("texts")}${lastData}`, rules:[{type:"expression",priority:2,formulae:["MOD(ROW(),2)=0"],style:{fill:{type:"pattern",pattern:"solid",bgColor:{argb:"FFF5F7FC"}}}}]});
    scaleCF(wsData, `${L("s_social")}2:${L("s_indep")}${lastData}`);
    scaleCF(wsData, `${L("s_climate")}2:${L("s_climate")}${lastData}`);
  }

  /* ---- students list ---- */
  const studs = []; const seen=new Set();
  v2.forEach(r=>{ const k=`${r.className} | ${r.name}`; if(!seen.has(k)){ seen.add(k); studs.push({k,name:r.name,cl:r.className}); } });
  studs.sort((a,b)=>a.cl.localeCompare(b.cl,"he")||a.name.localeCompare(b.name,"he"));
  headerRow(wsStu, 1, ["מפתח (כיתה | שם)","שם התלמיד/ה","כיתה","מילויי תלמיד","מילויי צוות"]);
  studs.forEach((s,i)=>{ const n=i+2;
    cell(wsStu,n,1,s.k); cell(wsStu,n,2,s.name); cell(wsStu,n,3,s.cl);
    cell(wsStu,n,4,`=COUNTIFS(${R("key")},A${n},${R("grp")},"תלמיד")`,{h:"center"});
    cell(wsStu,n,5,`=COUNTIFS(${R("key")},A${n},${R("grp")},"צוות")`,{h:"center"}); });
  const stuLast = Math.max(2, studs.length+1);

  /* ---- 2. dashboard ---- */
  banner(wsDash, 11, "מיפוי עצמי – דשבורד", `${scopeLabel} · הופק ב־${new Date().toLocaleDateString("he-IL")} · כל המספרים מחושבים בנוסחאות מגיליון "נתונים" · סולם 1–3 · כלי מיפוי, לא כלי אבחוני`);
  const kpis = [
    ["תלמידים", `=COUNTA('תלמידים'!A2:A${MAXR})`, C.social, "0"],
    ["מילויים", `=COUNTA(${R("name")})`, C.learning, "0"],
    ["השוואות תלמיד–צוות", `=SUMPRODUCT((${R("grp")}="תלמיד")*(COUNTIFS(${R("key")},${R("key")},${R("grp")},"צוות",${R("tp")},${R("tp")})>0))`, C.emotion, "0"],
    ["ממוצע אקלים בית־ספרי", `=IFERROR(AVERAGEIFS(${R("s_climate")},${R("latest")},1,${R("grp")},"תלמיד"),"—")`, C.climate, "0.00"],
    ["מטרות אישיות שנבחרו", `=COUNTIFS(${R("g_social")},"?*")+COUNTIFS(${R("g_learning")},"?*")+COUNTIFS(${R("g_emotion")},"?*")+COUNTIFS(${R("g_indep")},"?*")`, C.yellow, "0"]
  ];
  const kpiCols = [[1,1],[2,3],[4,5],[6,7],[8,8]];
  kpis.forEach((k,i)=>{ const [a,b]=kpiCols[i], la=wsDash.getColumn(a).letter, lb=wsDash.getColumn(b).letter;
    wsDash.mergeCells(`${la}5:${lb}5`); wsDash.mergeCells(`${la}6:${lb}7`);
    const t=wsDash.getCell(`${la}5`); t.value=k[0]; t.font={name:FONT,size:10,bold:true,color:{argb:k[2][1]}}; t.fill=fill(k[2][0]); t.alignment={horizontal:"center",vertical:"middle",readingOrder:"rtl"};
    const v=wsDash.getCell(`${la}6`); v.value={formula:k[1].slice(1)}; v.font={name:FONT,size:26,bold:true,color:{argb:k[2][1]}}; v.fill=fill(k[2][0]); v.alignment={horizontal:"center",vertical:"middle"}; v.numFmt=k[3]; });
  wsDash.getRow(5).height=22; wsDash.getRow(6).height=26; wsDash.getRow(7).height=26;
  section(wsDash, 9, 8, "📊 ממוצעים לפי תחום ולאורך השנה (תלמיד = הערכה עצמית · צוות = התרשמות הצוות)", C.social);
  headerRow(wsDash, 10, ["תחום",...TPN.flatMap(t=>[`${t}\nתלמיד`,`${t}\nצוות`]),"שינוי בהערכה העצמית"]);
  const domRows = [...DOMAINS.map(d=>({k:d.k,name:d.name,score:"s_"+d.k,staff:true})), {k:"climate",name:"אקלים בית־ספרי (נפרד)",score:"s_climate",staff:false}];
  domRows.forEach((d,i)=>{ const n=11+i;
    cell(wsDash,n,1,d.name,{bold:true,fill:DCOLOR[d.k][0]});
    TPN.forEach((t,j)=>{
      cell(wsDash,n,2+j*2,`=${avgIfs(d.score,`${R("grp")},"תלמיד",${R("tp")},"${t}"`)}`,{h:"center",num:"0.00",size:11,bold:true});
      cell(wsDash,n,3+j*2, d.staff? `=${avgIfs(d.score,`${R("grp")},"צוות",${R("tp")},"${t}"`)}` : "—",{h:"center",num:"0.00",color:C.muted});
    });
    cell(wsDash,n,8,`=IF(COUNT(B${n},D${n},F${n})<2,"",IF(ISNUMBER(F${n}),F${n},D${n})-IF(ISNUMBER(B${n}),B${n},D${n}))`,{h:"center",num:"+0.00;-0.00;0.00",bold:true});
    wsDash.getRow(n).height=22;
  });
  scaleCF(wsDash, "B11:G15"); arrowsCF(wsDash, "H11:H15");
  /* interests & supports */
  const intRow = 18;
  section(wsDash, intRow, 8, "🎨 מה התלמידים אוהבים לעשות · 🤲 מה עוזר להם כשקשה (לפי המילוי האחרון)", C.mint);
  headerRow(wsDash, intRow+1, ["תחום עניין","תלמידים"]);
  [["מה עוזר",5],["תלמידים",6]].forEach(([l,c])=>{ const x=wsDash.getCell(intRow+1,c); x.value=l; x.font={name:FONT,bold:true,size:10,color:{argb:C.white}}; x.fill=fill(C.navy); x.alignment={horizontal:"center",vertical:"middle",readingOrder:"rtl"}; x.border=box; });
  const cntLatest = (k, word) => `=SUMPRODUCT((${R("latest")}=1)*(${R("grp")}="תלמיד")*ISNUMBER(SEARCH("${word}",${R(k)})))`;
  const intList = [...INTERESTS.map(x=>x[0]),"אחר"], supList = [...HELPS.map(x=>x[0]),"אחר"];
  for(let i=0;i<Math.max(intList.length,supList.length);i++){ const n=intRow+2+i;
    if(intList[i]){ cell(wsDash,n,1,intList[i]); cell(wsDash,n,2,cntLatest("interests",intList[i]),{h:"center",bold:true}); }
    if(supList[i]){ cell(wsDash,n,5,supList[i]); cell(wsDash,n,6,cntLatest("supports",supList[i]),{h:"center",bold:true}); }
  }
  barCF(wsDash, `B${intRow+2}:B${intRow+1+intList.length}`, "FF4CB66A");
  barCF(wsDash, `F${intRow+2}:F${intRow+1+supList.length}`, "FF3D8BE0");
  wsDash.getColumn(5).width = 20;

  /* ---- 3. student profile ---- */
  banner(wsProf, 11, "פרופיל תלמיד/ה", "בוחרים תלמיד/ה ברשימה הנפתחת (התא הצהוב) – כל הטבלה, התובנות והמטרות מתעדכנים אוטומטית", C.pink[1]);
  wsProf.mergeCells("A5:A5"); cell(wsProf,5,1,"👈 בחירת תלמיד/ה:",{bold:true,size:12,border:false});
  wsProf.mergeCells("B5:F5");
  const sel = wsProf.getCell("B5"); sel.value = studs[0]?.k || "";
  sel.font={name:FONT,size:14,bold:true,color:{argb:C.ink}}; sel.fill=fill("FFFFE07A"); sel.alignment={horizontal:"center",vertical:"middle",readingOrder:"rtl"};
  sel.border={top:{style:"medium",color:{argb:"FFE3A900"}},bottom:{style:"medium",color:{argb:"FFE3A900"}},left:{style:"medium",color:{argb:"FFE3A900"}},right:{style:"medium",color:{argb:"FFE3A900"}}};

    studs.filter(s=>s.cl===cl).forEach((s,i)=>{ const n=14+i, kq=`"${s.k.replace(/"/g,'""')}"`;
      cell(ws,n,1,s.name,{bold:true});
      [...DOMAINS.map(d=>"s_"+d.k),"s_climate"].forEach((k,j)=>cell(ws,n,2+j,`=${latestVal(k,kq,"תלמיד")}`,{h:"center",num:"0.00"}));
      cell(ws,n,7,`=${txt(latestVal("tp",kq,"תלמיד"))}`,{h:"center"});
      scaleCF(ws,`B${n}:F${n}`); });
  });

  /* ---- 10. legend ---- */
  banner(wsLegend, 4, "מקרא והסבר", "איך הקובץ עובד, מה כל עמודה אומרת, ואיך מוסיפים נתונים");
  const how = [
    ["איך זה עובד?","כל הגיליונות מחושבים בנוסחאות מתוך גיליון \"נתונים\". כשמשנים או מוסיפים שם שורה – הכול מתעדכן."],
    ["פרופיל תלמיד/ה","בוחרים תלמיד/ה בתא הצהוב, והטבלה, התובנות והמטרות מתעדכנות מיד."],
    ["הוספת נתונים","הדרך המומלצת: ייצוא חדש מהמערכת (לשונית \"נתונים ו־Excel\"). תלמיד/ה חדש/ה מצטרף/ת לרשימות בייצוא הבא."],
    ["סולם","3 = מצליח/ה / רוב הזמן / כן · 2 = לפעמים · 1 = צריך/ה עזרה / נדרש סיוע / לא"],
    ["צבעים","ירוק = 3 · צהוב = 2 · אדום = 1 · כתום = פער של "+GAP_FLAG+" ומעלה בין תלמיד/ה לצוות · חיצים = כיוון השינוי"],
    ["חשוב","זהו כלי מיפוי בית־ספרי ולא כלי אבחוני. התובנות מנוסחות כנקודות לחשיבה מקצועית."]
  ];
  how.forEach((x,i)=>{ const n=5+i; cell(wsLegend,n,1,x[0],{bold:true,fill:C.yellow[0]}); wsLegend.mergeCells(`B${n}:D${n}`); cell(wsLegend,n,2,x[1]); wsLegend.getRow(n).height=30; });
  let lr = 13;
  headerRow(wsLegend, lr, ["עמודה","תלמיד/ה – מילולי","תלמיד/ה – תת״ח","צוות"]); lr++;
  ITEM_IDS.forEach(id=>{ const k=id.slice(0,-1), i=+id.slice(-1)-1; cell(wsLegend,lr,1,`${DNAME[k]} ${i+1}`,{fill:DCOLOR[k][0],bold:true}); cell(wsLegend,lr,2,ITEMS.high[k][i]); cell(wsLegend,lr,3,ITEMS.visual[k][i]); cell(wsLegend,lr,4,ITEMS.staff[k][i]); lr++; });
  CLIMATE.high.forEach((q,i)=>{ cell(wsLegend,lr,1,`אקלים ${i+1}`,{fill:C.climate[0],bold:true}); cell(wsLegend,lr,2,q); cell(wsLegend,lr,3,CLIMATE.visual[i]); cell(wsLegend,lr,4,"—"); lr++; });
  STAFF_OBS.forEach(o=>{ cell(wsLegend,lr,1,o.k,{fill:C.orange[0],bold:true}); cell(wsLegend,lr,2,"—"); cell(wsLegend,lr,3,"—"); cell(wsLegend,lr,4,o.t); lr++; });

  /* old-version rows kept apart */
  if(old.length){
    const wo = sheet("גרסה קודמת", C.muted, [12,12,18,18,14,40]);
    headerRow(wo,1,["תאריך","מועד","סוג שאלון","שם","כיתה","הערה"]);
    old.forEach((r,i)=>{ const n=i+2; [r.date,TP[r.timepoint]||"",TYPE_LABEL[r.type]||r.type,r.name,r.className,"מילוי מגרסה קודמת – לא נכלל בניתוח"].forEach((v,j)=>cell(wo,n,j+1,v||"")); });
  }
  return wb;
}


/* direct links: index.html#visual opens the TT"CH questionnaire, #staff the staff one, etc. */
const DEEP = ["high","visual","staff","track","data"];
const hashTab = () => { const h = decodeURIComponent(location.hash.slice(1)); return DEEP.includes(h)? h : null; };
window.addEventListener("hashchange", ()=>{ const h=hashTab(); if(h && h!==currentTab) switchTab(h); });
if(hashTab()) switchTab(hashTab()); else renderForm("high");
loadTexts();
</script>
