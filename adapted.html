<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>שאלונים מותאמים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: a staff setup card → a full-screen, one-question-per-screen student mode with two giant answer targets → a staff observation sheet → summary. */
:root{
  --bg:#EEF2F8; --paper:#FFFFFF; --ink:#1E2A4F; --muted:#56607E; --line:#DCE2EE; --accent:#2F56B0; --accent-soft:#E6EDFB;
  --yes-btn:#1F8A43; --no-btn:#C42F39; --yes-soft:#E2F5E5; --no-soft:#FDE2E3; --focus:#F2B705;
  --social:#24448F; --learning:#17775A; --emotion:#C2295A; --indep:#5B3FB8; --climate:#13879A; --warm:#B4541A; --warm-soft:#FDEBDD;
  --run-bg:#FFFFFF; --run-ink:#1E2A4F;
  --font-display:"Rubik","Assistant",system-ui,sans-serif;
  --font-body:"Assistant","Rubik","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10162A; --paper:#18213A; --ink:#EEF2FA; --muted:#A9B3CD; --line:#2C3759; --accent:#93B1FF; --accent-soft:#22305A;
  --yes-soft:#173A24; --no-soft:#3D1A1E; --warm:#F2A06A; --warm-soft:#3A2416;
  --social:#93B1FF; --learning:#6FD3A9; --emotion:#FF8FB1; --indep:#B9A4FF; --climate:#6FD6E6;
  --run-bg:#18213A; --run-ink:#EEF2FA; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#10162A; --paper:#18213A; --ink:#EEF2FA; --muted:#A9B3CD; --line:#2C3759; --accent:#93B1FF; --accent-soft:#22305A;
  --yes-soft:#173A24; --no-soft:#3D1A1E; --warm:#F2A06A; --warm-soft:#3A2416;
  --social:#93B1FF; --learning:#6FD3A9; --emotion:#FF8FB1; --indep:#B9A4FF; --climate:#6FD6E6;
  --run-bg:#18213A; --run-ink:#EEF2FA; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:18px;line-height:1.5;direction:rtl;padding-inline:16px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
.wrap{max-width:860px;margin:0 auto;padding-block:28px 48px;display:flex;flex-direction:column;gap:20px}
.hero{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-weight:700;color:var(--accent);letter-spacing:.02em;font-size:15px}
.hero h1{font-size:clamp(30px,5vw,42px);font-weight:800}
.hero p{margin:0;color:var(--muted);max-width:62ch}
.preview-note{background:var(--warm-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:16px}
.preview-note b{color:var(--warm)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.card h2{font-size:22px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.flabel{font-weight:700;font-size:16px}
input[type=text],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:80px;resize:vertical}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.mode{position:relative}
.mode input{position:absolute;opacity:0;inset:0}
.mode span{display:flex;flex-direction:column;gap:4px;height:100%;border:2px solid var(--line);border-radius:14px;padding:14px;background:var(--bg);cursor:pointer}
.mode span b{font-family:var(--font-display);font-size:18px}
.mode span small{color:var(--muted);font-size:15px;line-height:1.35}
.mode input:checked + span{border-color:var(--accent);background:var(--accent-soft)}
.mode input:focus-visible + span{outline:3px solid var(--focus);outline-offset:2px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;background:var(--bg);font-size:16px}
.seg input{accent-color:var(--accent);width:18px;height:18px}
.check{display:flex;align-items:center;gap:10px;font-size:17px}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.hint{color:var(--muted);font-size:15px;margin:0}
.btn{font:inherit;font-family:var(--font-display);font-weight:700;font-size:20px;border:0;border-radius:14px;padding:14px 26px;background:var(--accent);color:var(--paper);cursor:pointer;min-height:52px}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.btn:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-start}
.calrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.calrow .q{flex:1 1 200px;font-weight:600}

/* ---------- student run ---------- */
#run{position:fixed;inset:0;z-index:20;background:var(--run-bg);color:var(--run-ink);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
#run.cvi{--run-bg:#000000;--run-ink:#FFFFFF;--yes-btn:#14B84A;--no-btn:#FF2E3B}
.rtop{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:currentColor;opacity:.22}
.dots i.on{opacity:1}
.staffbar{display:flex;gap:8px;flex-wrap:wrap}
.sbtn{font:inherit;font-size:15px;font-weight:600;border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:10px;padding:6px 12px;cursor:pointer;opacity:.7;min-height:40px}
.sbtn:hover,.sbtn:focus-visible{opacity:1}
.rmid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:0;text-align:center}
.rtag{font-family:var(--font-display);font-weight:700;font-size:18px;padding:3px 14px;border-radius:999px;color:#fff}
.rsym{width:min(34vh,260px);height:min(34vh,260px);background:#fff;border-radius:24px;padding:10px;border:3px solid currentColor}
#run.cvi .rsym{border-color:#FFD400}
.rsym svg{width:100%;height:100%}
.rq{font-family:var(--font-display);font-weight:800;font-size:clamp(28px,5vw,48px);line-height:1.2;max-width:22ch}
.rbot{display:flex;gap:min(4vw,40px);height:min(36vh,300px);flex:none}
.ans{flex:1;border:0;border-radius:28px;color:#fff;font-family:var(--font-display);font-weight:800;font-size:clamp(34px,7vw,64px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;position:relative;overflow:hidden;outline:none;transition:transform .15s}
.ans svg{width:min(14vh,110px);height:min(14vh,110px)}
.ans.yes{background:var(--yes-btn)}
.ans.no{background:var(--no-btn)}
.ans.some{background:#B57F00}
.sh-a.s{background:#B57F00}
.ans.scan{outline:10px solid var(--focus);outline-offset:-10px;transform:scale(1.03)}
.ans:not(.scan).dim{opacity:.45}
.ans:focus-visible{outline:8px solid var(--focus);outline-offset:-8px}
.ans .fill{position:absolute;inset:auto 0 0 0;height:0;background:rgba(255,255,255,.35);pointer-events:none}
.ans.dwelling .fill{animation:dwell var(--dwell,1.5s) linear forwards}
@keyframes dwell{to{height:100%}}
.done{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;font-family:var(--font-display);font-weight:800;font-size:clamp(40px,8vw,80px);color:#fff}
.done svg{width:150px;height:150px}
.rhint{font-size:15px;opacity:.75;text-align:center;margin:8px 0 0}

/* ---------- staff + summary ---------- */
.obs{width:100%;border-collapse:collapse}
.obs th,.obs td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
.obs th{font-size:15px;color:var(--muted)}
.obs td.d{font-weight:700;width:30%}
.obs td.d small{display:block;font-weight:400;color:var(--muted);font-size:15px}
.obs .o{text-align:center;width:18%}
.obs input{width:24px;height:24px;accent-color:var(--accent)}
.tablewrap{overflow-x:auto}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.dom{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.dom h3{font-size:19px}
.arow{display:flex;justify-content:space-between;gap:10px;font-size:16px}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-weight:700;font-size:15px;white-space:nowrap}
.pill.y{background:var(--yes-soft);color:var(--yes-btn)}
.pill.n{background:var(--no-soft);color:var(--no-btn)}
.pill.u{background:var(--line);color:var(--muted)}
.ok{color:var(--yes-btn);font-weight:700}
.bad{color:var(--no-btn);font-weight:700}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .pill.y{color:#7BE39A} :root:not([data-theme="light"]) .pill.n{color:#FF9AA0} :root:not([data-theme="light"]) .ok{color:#7BE39A} :root:not([data-theme="light"]) .bad{color:#FF9AA0} }
:root[data-theme="dark"] .pill.y,:root[data-theme="dark"] .ok{color:#7BE39A}
:root[data-theme="dark"] .pill.n,:root[data-theme="dark"] .bad{color:#FF9AA0}
@media (prefers-reduced-motion: reduce){ .ans{transition:none} .ans.dwelling .fill{animation-duration:var(--dwell,1.5s)} }
@media (max-width:600px){ .rbot{height:28vh} .rsym{width:28vh;height:28vh} }
/* ---------- shell: tabs ---------- */
:root{--sheet-bg:#FFFFFF;--sheet-ink:#1E2A4F;--sheet-line:#DCE2EE}
.topbar{max-width:1000px;margin:0 auto;padding-block:20px 0;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--font-display);font-size:clamp(24px,4vw,32px);font-weight:800}
.brand span{color:var(--muted);font-size:15px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:16px;background:transparent;color:var(--muted);border:0;border-bottom:4px solid transparent;padding:10px 14px;cursor:pointer;margin-bottom:-2px;min-height:44px}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1000px}
.qpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.qcard{font:inherit;color:inherit;text-align:right;background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:20px;display:flex;gap:16px;align-items:flex-start;cursor:pointer}
.qcard:hover,.qcard:focus-visible{border-color:var(--accent);outline:none}
.qcard .ic{width:84px;height:84px;flex:none;background:#fff;border-radius:14px;border:1.5px solid var(--line);padding:4px}
.qcard .ic svg{width:100%;height:100%}
.qcard h2{font-size:21px;margin-bottom:4px}
.qcard p{margin:0;color:var(--muted);font-size:16px}
.badge{display:inline-block;font-size:13px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--accent-soft);color:var(--accent);margin-bottom:6px}
/* photos */
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.slot{border:1.5px dashed var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg);min-width:0}
.slot.has{border-style:solid;border-color:var(--yes-btn)}
.slot .ph{aspect-ratio:1;max-width:100%;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--line)}
.slot .ph img{width:100%;height:100%;object-fit:cover}
.slot .ph svg{width:80%;height:80%;opacity:.55}
.slot b{font-size:16px}
.slot small{color:var(--muted);font-size:14px;line-height:1.35}
.slot .row{display:flex;gap:8px;flex-wrap:wrap}
.upl{font:inherit;font-weight:700;font-size:15px;border-radius:10px;border:1.5px solid var(--accent);color:var(--accent);background:var(--paper);padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.upl input{position:absolute;width:1px;height:1px;opacity:0}
.upl:focus-within{outline:3px solid var(--focus)}
.linkbtn{font:inherit;font-size:14px;background:none;border:0;color:var(--no-btn);cursor:pointer;text-decoration:underline;padding:4px}
.req{color:var(--no-btn);font-weight:700}
.progress{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted)}
.progress .bar{flex:1;max-width:220px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.progress .bar span{display:block;height:100%;background:var(--yes-btn)}
.msg{border-radius:12px;padding:10px 14px;font-size:16px}
.msg.ok{background:var(--yes-soft)}
.msg.err{background:var(--no-soft)}
.lock{max-width:420px}
.ro-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.ans img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.ans.pick{background:#fff;border:6px solid var(--line)}
.ans.pick .cap{position:absolute;inset:auto 0 0 0;background:rgba(0,0,0,.55);color:#fff;font-size:22px;padding:6px}
.ans.pick svg.fb{width:70%;height:70%}
.rsym img{width:100%;height:100%;object-fit:cover;border-radius:16px}
/* parent sheet */
.sheetwrap{overflow-x:auto}
.sheet{width:794px;max-width:none;background:var(--sheet-bg);color:var(--sheet-ink);border-radius:6px;box-shadow:0 6px 24px rgba(20,30,60,.18);padding:36px 40px;display:flex;flex-direction:column;gap:16px;margin:0 auto}
.sh-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:3px solid var(--sheet-line);padding-bottom:14px}
.sh-h h2{font-size:30px;font-weight:800}
.sh-h .meta{font-size:14px;color:#56607E;text-align:left;line-height:1.5}
.sh-photo{width:92px;height:92px;border-radius:50%;object-fit:cover;border:4px solid #F2B705;flex:none}
.sh-sec{font-family:var(--font-display);font-weight:700;font-size:18px;padding:4px 14px;border-radius:999px;color:#fff;align-self:flex-start}
.sh-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.sh-q{border:1.5px solid var(--sheet-line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.sh-q .im{width:120px;height:120px;border-radius:10px;overflow:hidden;background:#fff}
.sh-q .im img,.sh-q .im svg{width:100%;height:100%;object-fit:cover}
.sh-q p{margin:0;font-weight:700;font-size:15px;line-height:1.3}
.sh-a{font-family:var(--font-display);font-weight:800;font-size:20px;border-radius:999px;padding:3px 18px;color:#fff}
.sh-a.y{background:#1F8A43}.sh-a.n{background:#C42F39}.sh-a.u{background:#8A93A8}
.sh-note{background:#FFF6D6;border-radius:12px;padding:12px 16px;font-size:15px;line-height:1.55}
.sh-note b{font-family:var(--font-display)}
.sh-foot{display:flex;justify-content:space-between;font-size:13px;color:#56607E;border-top:1px solid var(--sheet-line);padding-top:10px}
.reslist{display:flex;flex-direction:column;gap:8px}
.resrow{font:inherit;color:inherit;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;text-align:right}
.resrow[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.empty{color:var(--muted);text-align:center;padding:24px;border:1.5px dashed var(--line);border-radius:14px}
@media (max-height:760px){ .rsym{width:24vh;height:24vh} .rq{font-size:clamp(22px,4.2vh,36px)} .rbot{height:32vh} .rmid{gap:6px} .ans svg{width:9vh;height:9vh} .ans{font-size:clamp(28px,6vh,52px)} }
input[type=password]{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.topbar a,.brand a{color:var(--accent)}
.obs input[type=text]{min-width:180px}
.pill.y{background:var(--yes-soft);color:var(--yes-btn)}
</style></head><body>
<div id="top"></div><div id="app"></div><div id="run" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ================= content ================= */
const DOM = {
  cal:{name:"חימום",color:"#5B6584"}, social:{name:"חברתי",color:"#24448F"}, learning:{name:"למידה",color:"#17775A"},
  emotion:{name:"רגשי",color:"#C2295A"}, indep:{name:"השתתפות",color:"#5B3FB8"}, climate:{name:"בית הספר",color:"#13879A"},
  id:{name:"זה אני",color:"#B4541A"}, selfcare:{name:"עצמאות",color:"#5B3FB8"}, can:{name:"אני יכול/ה",color:"#17775A"}, pride:{name:"גאווה ושייכות",color:"#C2295A"},
};
/* photo slots a teacher uploads for each student (class photo is shared by the class) */
const SLOTS = [
  {k:"self", t:"תמונת פנים של התלמיד/ה", d:"פנים ברורות, רקע פשוט. לשאלות ״איפה אני?״ ו״זה אני?״.", req:true, sym:"me"},
  {k:"other", t:"ילד/ה שהתלמיד/ה לא מכיר/ה", d:"מספר או ממאגר, לא תלמיד/ה מבית הספר. להשוואה ב״איפה אני?״.", req:true, sym:"otherkid"},
  {k:"act_social", t:"אומר/ת שלום", d:"עם חבר/ה או מבוגר/ת. חברתי: ״אני יכול/ה להגיד שלום לחברים״.", sym:"greet"},
  {k:"act_play", t:"משחק/ת עם חבר/ה", d:"משחק משותף עם ילד/ה. חברתי: ״אני יכול/ה לשחק עם חבר/ה״.", sym:"playwc"},
  {k:"act_switch", t:"מפעיל/ה מתג או מסך", d:"מתג, טאבלט או צעצוע. למידה: ״אני יכול/ה להפעיל את המתג או המסך״.", sym:"switchpress"},
  {k:"act_join", t:"משתתף/ת בפעילות", d:"במעגל, בשיר או בפעילות כיתתית. למידה: ״אני יכול/ה להשתתף בפעילות״.", sym:"activity"},
  {k:"smile", t:"מחייך/ת", d:"רגע של שמחה אמיתית. רגשות: ״אני יכול/ה להראות שאני שמח/ה״.", sym:"happy"},
  {k:"act_calm", t:"רגוע/ה", d:"נרגע/ת עם מוזיקה, חיבוק או פינה שקטה. רגשות: ״אני יכול/ה להירגע״.", sym:"calmwc"},
  {k:"act_choose", t:"בוחר/ת בין שני דברים", d:"מבט או הצבעה על אחת משתי אפשרויות. עצמאות: ״אני יכול/ה לבחור״.", sym:"choose"},
  {k:"act_help", t:"משתתף/ת באוכל או בלבוש", d:"מחזיק/ה כוס, מושיט/ה יד לשרוול. עצמאות: ״אני יכול/ה לעזור באוכל או בלבוש״.", sym:"helpself"},
  {k:"work", t:"עבודה שהתלמיד/ה יצר/ה", d:"ציור, יצירה או תוצר. גאווה: ״את זה אני עשיתי״.", sym:"artwork"},
];
const CLASS_SLOT = {t:"תמונה של הכיתה", d:"החדר או הקבוצה, משותפת לכל הכיתה. לשאלה ״זו הכיתה שלי״.", sym:"myclass"};

/* item: [id, domain, male, female, symbol, photoSlot|null, type, expected] */

function applyWording(){

    Q[k].items = DEF[k].items.map(it=>{ const o=ADAPTED_CFG.overrides?.[it[0]]; const c=[...it]; if(o?.m) c[2]=o.m; if(o?.f) c[3]=o.f; return c; });

try{ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }catch(e){}
function say(t, done){
  if(!S.voice || !("speechSynthesis" in window)){ done && setTimeout(done,600); return; }
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang="he-IL"; if(heVoice) u.voice=heVoice; u.rate=.9;
    let f=false; const fin=()=>{ if(!f){ f=true; done&&done(); } }; u.onend=fin; u.onerror=fin; setTimeout(fin,4500); speechSynthesis.speak(u);
  }catch(e){ done && setTimeout(done,600); }
}

let phCls="", phName="";
function shrink(file){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onerror=rej; fr.onload=()=>{ const img=new Image(); img.onerror=rej; img.onload=()=>{
  const m=640, s=Math.min(1, m/Math.max(img.width,img.height)); const cv=document.createElement("canvas"); cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s);
  const g=cv.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,cv.width,cv.height); g.drawImage(img,0,0,cv.width,cv.height); res(cv.toDataURL("image/jpeg",.8)); }; img.src=fr.result; }; fr.readAsDataURL(file); }); }
async function renderPhotos(msg){

  const slotCard=(key,t,d,req,sym,src)=>`<div class="slot ${src?"has":""}"><div class="ph">${src?`<img src="${src}" alt="${esc(t)}">`:SYM[sym]}</div>

  $("#app").innerHTML = `<div class="wrap"><div class="hero"><h1 style="font-size:28px">תמונות לתלמידים</h1>
    <p>בכל שאלה שיש לה תמונה, התמונה מחליפה את סמל התת״ח. שאלה בלי תמונה מוצגת עם הסמל.</p></div>${msg||""}
    <section class="card"><div class="grid2">
      <div class="field"><label for="ph-c">כיתה</label><select id="ph-c">${cls.map(c=>`<option ${c===phCls?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
      <div class="field"><label for="ph-n">תלמיד/ה</label><select id="ph-n">${names.map(n=>`<option value="${esc(n)}" ${n===phName?"selected":""}>${esc(n)} · ${counts[n]||0}/${SLOTS.length}</option>`).join("")}</select></div>
    </div>${phName?`<div class="progress"><span>${done} מתוך ${SLOTS.length} תמונות</span><div class="bar"><span style="width:${done/SLOTS.length*100}%"></span></div></div>`:""}</section>
    ${phName?`<section class="card"><h2>התמונות של ${esc(phName)}</h2><div class="slots">${SLOTS.map(s=>slotCard(s.k,s.t,s.d,s.req,s.sym,ph[s.k])).join("")}</div></section>`:`<div class="empty">אין תלמידים בכיתה הזו.</div>`}
    <section class="card"><h2>תמונה משותפת ל${esc(phCls)}</h2><div class="slots">${slotCard("__class",CLASS_SLOT.t,CLASS_SLOT.d,false,CLASS_SLOT.sym,classSrc)}</div></section>

/* ================= run ================= */
let idx=0, scanTimer=null, scanIdx=0, lockUntil=0, dwellTimer=null, busy=false;
const ICON_YES=`<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="rgba(255,255,255,.22)" stroke="#fff" stroke-width="6"/><path d="M28 52 l15 15 l30 -32" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const ICON_NO=`<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="rgba(255,255,255,.22)" stroke="#fff" stroke-width="6"/><path d="M32 32 l36 36 M68 32 l-36 36" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/></svg>`;
const ICON_SOME=`<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="rgba(255,255,255,.22)" stroke="#fff" stroke-width="6"/><path d="M28 54 q11 -14 22 0 t22 0" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/></svg>`;
const items = () => Q[S.q].items;
const imgOf = it => { const p=photoFor(it[5],S.cls,S.name); return p? `<img src="${p}" alt="">` : (SYM[it[4]]||""); };
function startRun(){ const run=$("#run"); run.hidden=false; run.classList.toggle("cvi",S.cvi); document.body.style.overflow="hidden"; try{ run.requestFullscreen&&run.requestFullscreen().catch(()=>{}); }catch(e){} showItem(); }
function stopRun(){ clearInterval(scanTimer); scanTimer=null; clearTimeout(dwellTimer); try{ speechSynthesis.cancel(); }catch(e){}
  const run=$("#run"); if(run){ run.hidden=true; run.innerHTML=""; } document.body.style.overflow=""; try{ document.fullscreenElement&&document.exitFullscreen().catch(()=>{}); }catch(e){} }
function showItem(){
  clearInterval(scanTimer); scanTimer=null; clearTimeout(dwellTimer); busy=false;
  const list=items(); if(idx>=list.length){ stopRun(); renderStaff(); return; }
  const it=list[idx], d=DOM[it[1]];
  // "זה אני" identity items need the uploaded photos; without them the item is skipped
  if(it[1]==="id" && (!photoFor("self",S.cls,S.name) || !photoFor("other",S.cls,S.name))){ S.ans[it[0]]="na"; idx++; return showItem(); }
  let pair;
  if(it[6]==="pick"){
    const opts=[[1,photoFor("self",S.cls,S.name)],[0,photoFor("other",S.cls,S.name)]]; if((idx+S.name.length)%2) opts.reverse();
    pair=opts.map(([v,src])=>`<button type="button" class="ans pick" data-v="${v}" aria-label="תמונה ${v?"א":"ב"}"><span class="fill"></span><img src="${src}" alt=""></button>`).join("");
  } else {
    const noLab = "לא";
    const yes=`<button type="button" class="ans yes" data-v="1" data-say="כן" aria-label="כן"><span class="fill"></span>${ICON_YES}כן</button>`;
    const some=`<button type="button" class="ans some" data-v="0.5" data-say="קצת" aria-label="קצת"><span class="fill"></span>${ICON_SOME}קצת</button>`;
    const no=`<button type="button" class="ans no" data-v="0" data-say="${noLab}" aria-label="${noLab}"><span class="fill"></span>${ICON_NO}${noLab}</button>`;
    const set = [yes,no];
    pair = (S.yesSide==="right"? set : set.reverse()).join("");
  }
  const hint={touch:"נוגעים בתשובה.",gaze:`מסתכלים על התשובה ${S.dwell} שניות.`,scan:"לוחצים על המתג כשהתשובה הנכונה מוארת.",staff:"המבוגר/ת לוחץ/ת על התשובה שהתלמיד/ה הראה/תה."}[S.mode];
  $("#run").innerHTML=`<div class="rtop"><div class="dots" aria-label="שאלה ${idx+1} מתוך ${list.length}">${list.map((_,i)=>`<i class="${i<=idx?"on":""}"></i>`).join("")}</div>
    <div class="staffbar"><button type="button" class="sbtn" id="r-rep">הקראה חוזרת</button>${idx?`<button type="button" class="sbtn" id="r-back">חזרה</button>`:""}<button type="button" class="sbtn" id="r-skip">לא ענה/תה</button><button type="button" class="sbtn" id="r-exit">יציאה</button></div></div>
    <div class="rmid"><span class="rtag" style="background:${d.color}">${d.name}</span>${it[6]==="pick"?"":`<div class="rsym">${imgOf(it)}</div>`}<div class="rq">${esc(txt(it))}</div></div>
    <div class="rbot" style="--dwell:${S.dwell}s${it[6]==="pick"?";height:min(46vh,380px)":""}">${pair}</div><p class="rhint">${hint}</p>`;
  lockUntil=Date.now()+900;
  $("#r-rep").onclick=e=>{ e.stopPropagation(); readItem(); };
  $("#r-skip").onclick=e=>{ e.stopPropagation(); record(null); };
  $("#r-exit").onclick=e=>{ e.stopPropagation(); route(); };
  if($("#r-back")) $("#r-back").onclick=e=>{ e.stopPropagation(); do{ idx--; }while(idx>0 && S.ans[items()[idx][0]]==="na"); showItem(); };
  document.querySelectorAll(".ans").forEach(b=>{
    b.onclick=e=>{ e.stopPropagation(); if(S.mode==="scan") return selectScan(); if(Date.now()<lockUntil) return; record(+b.dataset.v); };
    if(S.mode==="gaze"){ b.onpointerenter=()=>{ if(busy) return; b.classList.add("dwelling"); clearTimeout(dwellTimer); dwellTimer=setTimeout(()=>{ if(Date.now()>=lockUntil) record(+b.dataset.v); }, parseFloat(S.dwell)*1000); };
      b.onpointerleave=()=>{ b.classList.remove("dwelling"); clearTimeout(dwellTimer); }; }
  });
  readItem();
}
function readItem(){ const it=items()[idx]; if(S.mode==="scan"){ clearInterval(scanTimer); scanTimer=null; document.querySelectorAll(".ans").forEach(b=>b.classList.remove("scan","dim")); }
  say(txt(it), ()=>{ if(S.mode==="scan" && !busy) startScan(); }); }
function startScan(){ const btns=[...document.querySelectorAll(".ans")]; if(!btns.length) return; const pick=items()[idx][6]==="pick"; scanIdx=0;
  const step=()=>{ btns.forEach((b,i)=>{ b.classList.toggle("scan",i===scanIdx); b.classList.toggle("dim",i!==scanIdx); }); say(pick? "התמונה הזו" : (btns[scanIdx].dataset.say||"")); };
  step(); clearInterval(scanTimer); scanTimer=setInterval(()=>{ scanIdx=(scanIdx+1)%btns.length; step(); }, parseFloat(S.scan)*1000); }
function selectScan(){ if(busy||!scanTimer||Date.now()<lockUntil) return; const b=document.querySelector(".ans.scan"); if(b) record(+b.dataset.v); }
function record(v){
  if(busy) return; busy=true; clearInterval(scanTimer); scanTimer=null; clearTimeout(dwellTimer);
  const it=items()[idx]; S.ans[it[0]]=v;
  const pick=it[6]==="pick";
  const label = v===null? "דילוג" : pick? "בחרת" : v===1? "כן" : v===0.5? "קצת" : "לא";
  const ov=document.createElement("div"); ov.className="done"; ov.style.background = v===null? "#5B6584" : pick? "#2F56B0" : v===1? "var(--yes-btn)" : v===0.5? "#B57F00" : "var(--no-btn)";
  ov.innerHTML=(pick||v===null? "" : v===1? ICON_YES : v===0.5? ICON_SOME : ICON_NO)+label; $("#run").appendChild(ov); if(v!==null) say(label);
  setTimeout(()=>{ idx++; showItem(); }, 1100);
}
document.addEventListener("keydown",e=>{ if($("#run").hidden) return; if((e.key===" "||e.key==="Enter") && S.mode==="scan"){ e.preventDefault(); selectScan(); } if(e.key==="Escape") route(); });
$("#run").addEventListener("pointerdown",e=>{ if(S.mode==="scan" && !e.target.closest(".staffbar")){ e.preventDefault(); selectScan(); } });

/* ================= parent sheet ================= */
let printSel="", justSaved=false;
const ansBadge = (it,v) => it[6]==="pick"? (v===1?`<span class="sh-a y">בחר/ה בעצמו/ה ✓</span>`:v===0?`<span class="sh-a n">בחר/ה בתמונה האחרת</span>`:`<span class="sh-a u">לא נבדק</span>`)
  : v===1?`<span class="sh-a y">כן</span>`: v===0.5?`<span class="sh-a s">קצת</span>`: v===0?`<span class="sh-a n">לא</span>`: v==="na"?`<span class="sh-a u">לא נבדק</span>`:`<span class="sh-a u">לא ענה/תה</span>`;
function sheetHTML(r){
  const q=Q[r.q]; if(!q) return "";
  const T=it=> r.wording?.[it[0]] || (r.gender==="f"?it[3]:it[2]);
  const img=it=>{ const p=photoFor(it[5],r.cls,r.name); return p?`<img src="${p}" alt="">`:(SYM[it[4]]||""); };
  const self=photoFor("self",r.cls,r.name);
  const groups=[...new Set(q.items.map(i=>i[1]))].filter(k=>k!=="cal");
  const fq=v=>(FREQ.find(f=>f[0]===v)||[,"—"])[1];
  let story="";
  if(r.q==="me"){
    const idOk = r.ans.p1===1 && r.ans.y1===1 && r.ans.y2===0, idNA = r.ans.p1==="na";
    const can=q.items.filter(i=>i[6]==="can"); const V={"1":1,"h":0.5,"0":0};
    const lvl=dk=>{ const v=can.filter(i=>i[1]===dk).map(i=>r.ans[i[0]]).filter(x=>typeof x==="number"); if(!v.length) return null; const m=v.reduce((a,b)=>a+b,0)/v.length; return `${DOM[dk].name}: ${m>=.75?"בטוח/ה":m>=.4?"חלקית":"עוד לא"}`; };
    const doms=["social","learning","emotion","selfcare"].map(lvl).filter(Boolean);
    const checked=can.filter(i=>typeof r.ans[i[0]]==="number" && r.verify?.[i[0]]);
    const match=checked.filter(i=>Math.abs(V[r.verify[i[0]]]-r.ans[i[0]])<.01).length;
    story=`<b>מה ראינו:</b> ${idNA?"שאלות הזיהוי לא נבדקו הפעם. ":idOk?"זיהה/תה את עצמו/ה בתמונה. ":"זיהוי עצמי בתמונה עדיין בתהליך. "}
      ${doms.length?`<b>תחושת מסוגלות:</b> ${doms.join(" · ")}. `:""}${checked.length?`${match} מתוך ${checked.length} תשובות תואמות את מה שהצוות רואה.`:""}
      ${r.obs?.pride?` גאווה כשמצליח/ה: ${fq(r.obs.pride)}.`:""}`;
  } else {
    const parts=["social","learning","emotion","indep","climate"].map(dk=>{ const os=q.obs.filter(o=>o[0].startsWith(dk)); const v=os.map(o=>+r.obs?.[o[0]]).filter(Boolean); if(!v.length) return null; const a=v.reduce((s,x)=>s+x,0)/v.length; return `${DOM[dk].name}: ${a>=2.5?"הרבה":a>=1.75?"לפעמים":"כמעט לא"}`; }).filter(Boolean);
    story=`<b>מה הצוות רואה ביום־יום:</b> ${parts.join(" · ")}.`;
  }
  return `<div class="sheet" dir="rtl" id="sheet">
    <div class="sh-h"><div style="display:flex;gap:16px;align-items:center">${self?`<img class="sh-photo" src="${self}" alt="">`:""}<div><div style="font-weight:700;color:#B4541A">${q.name}</div><h2>${esc(r.name)}</h2></div></div>
      <div class="meta">${esc(r.cls)}<br>${TPN[r.tp]||""} · ${fmtDate(r.date)}<br>ענה/תה ב: ${(MODES.find(m=>m[0]===r.mode)||[,""])[1]}</div></div>
    ${groups.map(gk=>`<span class="sh-sec" style="background:${DOM[gk].color}">${DOM[gk].name}</span>
      <div class="sh-grid">${q.items.filter(i=>i[1]===gk && i[0]!=="y2").map(it=>`<div class="sh-q"><div class="im">${it[6]==="pick"&&self?`<img src="${self}" alt="">`:img(it)}</div><p>${esc(T(it))}</p>${ansBadge(it,r.ans?.[it[0]])}</div>`).join("")}</div>`).join("")}
    <div class="sh-note">${story}${r.notes?`<br><b>הערה מהצוות:</b> ${esc(r.notes)}`:""}</div>
    <div class="sh-foot"><span>בית ספר אורים, אילת</span><span>התשובות נבחרו על ידי ${esc(r.name)} בעצמו/ה</span></div></div>`;
}
let prCls="__all";
async function renderPrint(){
  loading("טוען מילויים…");
  try{ await loadResults(); }catch(e){ $("#app").innerHTML=`<div class="wrap">${failMsg}</div>`; return; }

    ${justSaved?'<div class="msg ok">השאלון נשמר. זה הדף להורים ולתלמיד/ה.</div>':""}
    ${!RES.length?`<div class="empty">עוד אין מילויים. ממלאים שאלון בלשונית ״מילוי שאלון״, והדף יופיע כאן.</div>`:`
    <section class="card"><div class="grid2"><div class="field"><label for="pr-c">כיתה</label><select id="pr-c"><option value="__all">כל הכיתות</option>${cl.map(c=>`<option ${c===prCls?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
      <div class="field"><label for="pr-r">מילוי</label><select id="pr-r">${list.map(r=>`<option value="${r.id}" ${r.id===printSel?"selected":""}>${esc(r.name)} · ${Q[r.q]?.short||""} · ${TPN[r.tp]||""} · ${fmtDate(r.date)}</option>`).join("")}</select></div></div>
      <div class="actions"><button class="btn" type="button" id="pr-pdf" ${cur?"":"disabled"}>הורדת PDF להדפסה</button>${justSaved?`<button class="btn ghost" type="button" id="pr-more">מילוי נוסף</button>`:""}</div><div id="pr-msg"></div></section>
    <div class="sheetwrap">${cur?sheetHTML(cur):""}</div>`}</div>`;
  justSaved=false;
  if(!RES.length) return;
  $("#pr-c").onchange=e=>{ prCls=e.target.value; printSel=""; renderPrint(); };
  $("#pr-r").onchange=e=>{ printSel=e.target.value; renderPrint(); };
  if($("#pr-more")) $("#pr-more").onclick=()=>{ TAB="fill"; route(); };
  $("#pr-pdf").onclick=async()=>{
    const b=$("#pr-pdf"); b.disabled=true; b.textContent="מכין PDF…";
    try{
      const el=$("#sheet"); const c=await html2canvas(el,{scale:2,backgroundColor:"#ffffff",useCORS:true,logging:false,windowWidth:900});
      const pdf=new jspdf.jsPDF({orientation:"portrait",unit:"mm",format:"a4",compress:true});
      const W=210, H=297, m=8; let w=W-2*m, h=c.height*w/c.width; if(h>H-2*m){ h=H-2*m; w=c.width*h/c.height; }
      pdf.addImage(c.toDataURL("image/jpeg",.92),"JPEG",(W-w)/2,m,w,h);
      saveBlob(pdf.output("blob"), `${cur.name} - ${Q[cur.q].short} - ${TPN[cur.tp]}.pdf`);
      b.textContent="הורדת PDF להדפסה"; b.disabled=false;
    }catch(e){ b.textContent="הורדת PDF להדפסה"; b.disabled=false; $("#pr-msg").innerHTML=`<div class="msg err">לא הצלחתי להכין את הקובץ. מנסים שוב.</div>`; }
  };
}
function saveBlob(blob, filename){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500); }

    ${q.items.map((it,i)=>`<tr><td class="d" style="width:16%"><span style="color:${DOM[it[1]].color}">${DOM[it[1]].name}</span></td>
      <td><input type="text" data-m="${it[0]}" value="${esc(it[2])}" aria-label="נוסח לבן" placeholder="${esc(d.items[i][2])}"></td>
      <td><input type="text" data-f="${it[0]}" value="${esc(it[3])}" aria-label="נוסח לבת" placeholder="${esc(d.items[i][3])}"></td></tr>`).join("")}</tbody></table></div></section>
    <section class="card"><h2>שאלות תצפית לצוות</h2><div class="tablewrap"><table class="obs"><tbody>
    ${q.obs.map((o,i)=>`<tr><td class="d" style="width:16%"><span style="color:${DOM[o[0].replace(/2$/,"")].color}">${DOM[o[0].replace(/2$/,"")].name}</span></td><td><input type="text" data-o="${o[0]}" value="${esc(o[1])}" aria-label="נוסח התצפית" placeholder="${esc(d.obs[i][1])}"></td></tr>`).join("")}</tbody></table></div></section>
    <div id="ed-msg"></div><div class="actions"><button class="btn" type="button" id="ed-save">שמירת הנוסחים</button><button class="btn ghost" type="button" id="ed-back">חזרה לניהול</button></div></div>`;
  $("#ed-back").onclick=()=>renderAdmin();
  $("#ed-save").onclick=async()=>{
    const ov={...ADAPTED_CFG.overrides}, ob={...ADAPTED_CFG.obs};
    d.items.forEach(it=>{ const m=$(`[data-m="${it[0]}"]`).value.trim(), f=$(`[data-f="${it[0]}"]`).value.trim(); const o={};
      if(m && m!==it[2]) o.m=m; if(f && f!==it[3]) o.f=f; if(Object.keys(o).length) ov[it[0]]=o; else delete ov[it[0]]; });
    d.obs.forEach(o=>{ const v=$(`[data-o="${o[0]}"]`).value.trim(); if(v && v!==o[1]) ob[k+":"+o[0]]=v; else delete ob[k+":"+o[0]]; });
    const val={overrides:ov, obs:ob, updatedAt:new Date().toISOString()};
    const {data} = await sb.rpc("sm_save_config",{p_pass:adminPass, p_key:"adapted", p_value:val});
    if(data===true){ ADAPTED_CFG=val; applyWording(); renderEditor(k); $("#ed-msg").innerHTML=`<div class="msg ok">הנוסחים נשמרו ויופיעו בכל מילוי חדש.</div>`; }
    else $("#ed-msg").innerHTML=`<div class="msg err">השמירה לא אושרה. יוצאים ונכנסים שוב עם הסיסמה.</div>`;
  };
}

/* ================= Excel (fills the analysis template) ================= */
async function exportExcel(){
  const b=$("#ad-xl"), out=$("#xl-msg"); b.disabled=true; b.textContent="מכין קובץ…"; out.innerHTML="";
  try{
    await loadResults();
    const buf = await (await fetch("adapted-template.xlsx",{cache:"no-store"})).arrayBuffer();
    const wb = new ExcelJS.Workbook(); await wb.xlsx.load(buf);
    const font={name:"Arial",size:10};
    const yn=v=> v===1?"כן": v===0?"לא": v==="na"?"": "לא ענה";
    const ex=v=> v==="1"?"כן": v==="0"?"לא": "";
    const vf=v=> v==="1"?"רוב הזמן": v==="h"?"לפעמים": v==="0"?"עדיין לא": "";
    const can3=v=> v===1?"כן": v===0?"לא": v==="na"?"": "לא ענה";
    const ME_CAN=["me_s1","me_s2","me_l1","me_l2","me_e1","me_e2","me_i1","me_i2"];
    const modeName=m=> ({touch:"מגע או לחיצה",gaze:"מבט",scan:"מתג",staff:"תיווך מבוגר/ת"})[m]||"";
    const sortRes=a=>[...a].sort((x,y)=>(x.cls||"").localeCompare(y.cls||"","he")||(x.name||"").localeCompare(y.name||"","he")||TP_ORDER.indexOf(x.tp)-TP_ORDER.indexOf(y.tp));
    const put=(ws,row,vals,ncols)=>{ for(let c=1;c<=ncols;c++){ const cell=ws.getCell(row,c); cell.value = vals[c-1]??null; cell.font=font; } };
    const well=sortRes(RES.filter(r=>r.q==="well")), me=sortRes(RES.filter(r=>r.q==="me"));
    if(well.length>200||me.length>200) out.innerHTML=`<div class="msg err">יש יותר מ־200 מילויים בשאלון אחד. בקובץ נכנסו 200 הראשונים.</div>`;
    const W=wb.getWorksheet("רווחה - קליטה"), M=wb.getWorksheet("זה אני - קליטה");
    put(W,5,[],30); put(M,5,[],31);
    well.slice(0,200).forEach((r,i)=>{ const a=r.ans||{}, o=r.obs||{};
      put(W,5+i,[r.name,r.cls,TPN[r.tp],fmtDate(r.date),r.filler||"",modeName(r.mode),r.und||"",
        ex(r.calExp?.cal1),yn(a.cal1),ex(r.calExp?.cal2),yn(a.cal2),
        ...["s1","s2","l1","l2","e1","i1","i2","c1","c2"].map(k=>yn(a[k])),
        ...["social","social2","learning","learning2","emotion","emotion2","indep","indep2","climate"].map(k=>o[k]?Number(o[k]):null),
        r.notes||""],30); });
    me.slice(0,200).forEach((r,i)=>{ const a=r.ans||{}, v=r.verify||{};
      put(M,5+i,[r.name,r.cls,TPN[r.tp],fmtDate(r.date),r.filler||"",modeName(r.mode),r.und||"",
        a.p1===1?"בחר/ה בעצמו/ה":a.p1===0?"בחר/ה באחר/ת":"לא נבדק", yn(a.y1), yn(a.y2),
        ...ME_CAN.map(k=>can3(a[k])), ...ME_CAN.map(k=>vf(v[k])),
        yn(a.me_w1), yn(a.me_k1), r.obs?.pride?Number(r.obs.pride):null, Number(r.scale||2), r.notes||""],31); });
    const uniq=a=>[...new Map(a.map(r=>[nk(r.name),r.name])).values()].sort((x,y)=>x.localeCompare(y,"he"));
    const fillCol=(ws,vals,max)=>{ for(let i=0;i<max;i++){ const c=ws.getCell(5+i,1); c.value=vals[i]??null; c.font=font; } };
    fillCol(wb.getWorksheet("רווחה - מעקב"), uniq(well), 200);
    fillCol(wb.getWorksheet("זה אני - מעקב"), uniq(me), 200);
    fillCol(wb.getWorksheet("סיכום כיתתי"), [...new Set(RES.map(r=>r.cls))].sort((x,y)=>x.localeCompare(y,"he")), 40);
    wb.calcProperties.fullCalcOnLoad = true;
    const outBuf = await wb.xlsx.writeBuffer();
    const d=new Date(); saveBlob(new Blob([outBuf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}), `שאלונים מותאמים - נתונים ${d.getDate()}.${d.getMonth()+1}.${d.getFullYear()}.xlsx`);
    if(!out.innerHTML) out.innerHTML=`<div class="msg ok">הקובץ ירד: ${well.length} מילויי רווחה, ${me.length} מילויי ״זה אני״. מתחילים מהגיליון ״הסבר״.</div>`;
  }catch(e){ out.innerHTML=`<div class="msg err">לא הצלחתי להכין את הקובץ. בודקים את האינטרנט ומנסים שוב.</div>`; }
  b.disabled=false; b.textContent="הורדת קובץ Excel";
}

/* ================= boot ================= */
async function boot(){
  if(!sb){ $("#app").innerHTML=`<div class="wrap">${failMsg}</div>`; return; }
  if(!staffCode) return renderGate();
  loading();
  try{ const {data} = await sb.rpc("sm_check_staff",{p_code:staffCode}); if(data!==true){ staffCode=""; return renderGate(); } await loadConfig(); }
  catch(e){ $("#app").innerHTML=`<div class="wrap">${failMsg}</div>`; return; }
  route();
}
boot();
</script>
